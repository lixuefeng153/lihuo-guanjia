<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>理货管家 · 供应商包裹产品理货与毛利核算</title>

<!-- 条码识别引擎：本地优先，避免国内网络下 CDN 加载失败导致相机扫码不可用 -->
<script src="zxing.min.js"></script>
<!-- 同步已改为 GitHub 仓库（data/state.json），无需 Supabase -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --text: #1f2933;
    --muted: #515b66;
    --border: #e3e8ef;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eaf1ff;
    --danger: #dc2626;
    --danger-soft: #fdecec;
    --danger-text: #b91c1c;
    --focus-ring: #1d4ed8;
    --profit: #15803d;
    --loss: #dc2626;
    --warn: #b45309;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
    --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 24px; --fs-2xl: 32px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, .toggle:focus-visible {
    outline: 3px solid var(--focus-ring); outline-offset: 2px;
  }

  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  .app-header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .app-header .logo { font-size: 22px; }
  .toolbar { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); padding: 8px 13px; border-radius: 9px;
    font-size: 14px; font-weight: 600; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--danger-text); border-color: #f2c4c4; background: var(--danger-soft); }
  .btn.danger:hover { background: #f9dada; }
  .btn.ghost { background: transparent; }

  .info-banner {
    margin: 14px 20px 0; padding: 10px 14px;
    background: var(--primary-soft); border: 1px solid #cfe0ff;
    border-radius: 10px; font-size: 13px; color: #1e40af;
  }
  .info-banner b { color: #1d4ed8; }
  .sync-bar { margin: 10px 20px 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .sync-status { display: inline-flex; align-items: center; gap: 6px; }
  .sync-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .sync-status.ok::before { background: #16a34a; }
  .sync-status.warn::before { background: #d97706; }
  .scan-in { margin: 14px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .scan-in-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .scan-in-label { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; }
  .scan-in-input { flex: 1 1 240px; padding: 11px 13px; border: 1.5px solid var(--primary); border-radius: 9px; font-size: 16px; letter-spacing: 1px; color: var(--text); background: #fff; }
  .scan-in-input:focus { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
  .scan-global { margin: 12px 20px 0; }
  .scan-result { margin-top: 10px; }
  .scan-card { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
  .scan-card + .scan-card { margin-top: 8px; }
  .scan-card .sc-name { font-weight: 700; font-size: 16px; }
  .scan-card .sc-meta { font-size: 13px; color: var(--muted); }
  .scan-stepper { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .scan-stepper input { width: 72px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; text-align: center; }
  .scan-empty { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .scan-empty select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; max-width: 100%; }
  .scan-dup { color: var(--warn); font-size: 12px; margin-top: 4px; display: none; }

  .summary {
    margin: 14px 20px 0;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .stat-card.accent .value { color: var(--primary); }
  .stat-card.profit .value { color: var(--profit); }
  .stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  main { padding: 16px 20px 60px; }
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty-state .big { font-size: 17px; color: var(--text); margin-bottom: 8px; }

  .store {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
  }
  .store-head, .pkg-head {
    display: flex; align-items: center; gap: 10px; padding: 13px 16px; flex-wrap: wrap;
  }
  .store-head { background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .toggle {
    border: none; background: transparent; font-size: 16px; color: var(--muted);
    width: 28px; height: 28px; border-radius: 6px; line-height: 1;
  }
  .toggle:hover { background: #e9eef5; color: var(--text); }
  .store-title { font-size: 16px; font-weight: 700; margin: 0; }
  .pkg-title { font-size: 14px; font-weight: 700; margin: 0; }
  .store-meta, .pkg-meta { font-size: 13px; color: var(--muted); }
  .store-actions, .pkg-actions, .row-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .store-actions .btn, .pkg-actions .btn, .row-actions .btn { padding: 6px 10px; font-size: 13px; }

  .store-body { padding: 6px 16px 14px; }
  .package { border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
  .pkg-head { background: #fbfcfe; }
  .pkg-body { padding: 12px 14px; }
  .pkg-subtotal {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
    font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap;
  }
  .pkg-subtotal b { color: var(--text); }
  .pkg-empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

  .products {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  }
  .product {
    display: flex; gap: 11px; padding: 10px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--surface);
  }
  .prod-img { width: 60px; height: 60px; flex: 0 0 60px; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
  .prod-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prod-img .no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-weight: 700; font-size: 14px; word-break: break-word; }
  .prod-nums { font-size: 13px; color: var(--muted); margin: 2px 0; }
  .prod-cost { font-size: 13px; }
  .prod-profit { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .prod-profit.up { color: var(--profit); }
  .prod-profit.down { color: var(--loss); }
  .prod-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .prod-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
  .tag.cat { background: var(--primary-soft); border-color: #cfe0ff; color: #1d4ed8; font-weight: 600; }
  .prod-barcode { margin-top: 6px; }
  .prod-barcode .barcode { width: 100%; max-width: 220px; height: 52px; display: block; background: #fff; }
  .row-actions { margin-left: 0; flex-direction: column; }

  /* Modal */
  .barcode-preview { width: 100%; max-width: 240px; height: 56px; background: #fff; padding: 6px; border-radius: 8px; border: 1px solid var(--border); }
  .barcode-preview svg { display: block; width: 100%; height: 44px; }
  .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 16px; background: var(--surface); color: var(--text); }
  .field select:focus { border-color: var(--primary); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: none; align-items: flex-start; justify-content: center;
    padding: 24px 14px; z-index: 50; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px;
    box-shadow: 0 20px 50px rgba(15,23,42,.3); margin: auto;
  }
  .modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 700; display: flex; align-items: center; }
  .modal-head .close { margin-left: auto; }
  .modal-body { padding: 16px 18px; }
  .modal-foot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-box { max-width: 420px; }
  .confirm-msg { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-line; }
  .confirm-box .modal-head { border-bottom: none; }
  #confirmModal .btn.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
  #confirmModal .btn.danger:hover { background: #c0392b; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .field input[type="text"], .field input[type="number"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 9px; font-size: 16px; color: var(--text); background: var(--surface);
  }
  .field input:focus { border-color: var(--primary); }
  .img-pick { display: flex; align-items: center; gap: 12px; }
  .img-preview { width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; background: var(--surface-2); flex: 0 0 64px; }
  .img-preview img { width: 100%; height: 100%; object-fit: cover; }
  .img-preview .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 11px 18px; border-radius: 10px;
    font-size: 14px; z-index: 80; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .cam-btn { display: inline-flex; align-items: center; gap: 5px; }
  .cam-stage { position: relative; background: #111; border-radius: 10px; overflow: hidden; aspect-ratio: 4/3; }
  .cam-stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam-hint {
    position: absolute; inset: 0; display: grid; place-items: center; color: #fff;
    text-align: center; padding: 14px; font-size: 13px; line-height: 1.7;
  }
  .cam-frame {
    position: absolute; left: 10%; right: 10%; top: 22%; bottom: 22%;
    border: 2px solid rgba(255,255,255,.85); border-radius: 12px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.28); pointer-events: none;
  }
  .cam-frame::after {
    content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px;
    background: rgba(192,86,33,.9); animation: camscan 2s ease-in-out infinite;
  }
  @keyframes camscan { 0%,100% { top: 20%; } 50% { top: 78%; } }
  @media (prefers-reduced-motion: reduce) { .cam-frame::after { animation: none; } }

  /* ---------- 半月报 ---------- */
  #reportView { max-width: 980px; margin: 0 auto 40px; padding: 0 14px; }
  .rp-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 18px 0 8px; }
  .rp-head h2 { margin: 0; font-size: 24px; }
  .rp-sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .rp-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rp-month { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .rp-month input { padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; }
  .rp-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 6px; }
  .rp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); text-align: center; }
  .rp-num { font-size: 32px; font-weight: 800; color: var(--primary); }
  .rp-den { font-size: 16px; color: var(--muted); font-weight: 600; }
  .rp-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .rp-delta { font-size: 12px; margin-top: 6px; font-weight: 600; }
  .rp-up { color: #c0392b; }
  .rp-down { color: #2e7d32; }
  .rp-flat { color: var(--muted); }
  .rp-table-wrap { overflow-x: auto; margin-top: 8px; }
  .rp-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .rp-table th, .rp-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--border); }
  .rp-table th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  .rp-table td:first-child { text-align: left; font-weight: 500; white-space: nowrap; }
  .rp-table tr:last-child td { border-bottom: none; }
  .rp-table .rp-cur { font-weight: 700; color: var(--primary); }
  .alert-bar { margin: 12px 20px 0; border: 1px solid #f5c4b3; background: #fdf3ee; border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .alert-bar h3 { margin: 0 0 6px; font-size: 14px; color: #993c1d; font-weight: 600; }
  .alert-bar .alert-sum { font-size: 13px; color: var(--text); margin-bottom: 8px; }
  .alert-list { margin: 0; padding-left: 18px; max-height: 170px; overflow: auto; }
  .alert-list li { font-size: 13px; margin: 3px 0; }
  .alert-tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
  .alert-low { background: #e6f1fb; color: #185fa5; }
  .alert-near { background: #faedda; color: #854f0b; }
  .alert-exp { background: #fcebeb; color: #a32d2d; }
  .prod-alerts { margin-top: 4px; }
  .alert-bar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .alert-bar-head h3 { margin: 0; }
  .clr-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .clr-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .clr-name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .clr-meta { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .prc-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 6px; }
  .prc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); text-align: center; }
  .prc-num { font-size: 24px; font-weight: 800; color: var(--primary); }
  .prc-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .prc-group { margin-top: 16px; }
  .prc-group h4 { margin: 0 0 8px; font-size: 14px; }
  @media (max-width: 560px) { .prc-cards { grid-template-columns: 1fr; } }
  .qv-rank { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--primary-soft, #e6f1fb); color: var(--primary); }
  .qv-rank.top { background: #faedda; color: #854f0b; }
  .qv-meta-line { font-size: 13px; color: var(--muted); margin: 6px 0; line-height: 1.7; }
  .qv-tip { margin-top: 6px; font-size: 13px; }
  #quarterSelect { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--text); max-width: 190px; }
  @media (max-width: 560px) { .alert-bar { margin-left: 14px; margin-right: 14px; } }
  #reportView h3 { margin: 22px 0 10px; font-size: 17px; border-left: 4px solid var(--primary); padding-left: 10px; }
  #reportView h4 { margin: 16px 0 8px; font-size: 14px; color: var(--text); }
  .rp-note, .rp-muted { color: var(--muted); font-size: 12px; }
  .rp-empty { color: var(--muted); padding: 14px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
  .rp-freq-list { display: flex; flex-direction: column; gap: 8px; }
  .rp-freq { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
  .rp-freq-main { display: flex; align-items: center; gap: 8px; }
  .rp-freq-name { font-weight: 700; }
  .rp-tag { font-size: 12px; background: #eef2ff; color: #4338ca; padding: 2px 8px; border-radius: 999px; }
  .rp-freq-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .rp-phase { color: var(--profit); font-weight: 700; }
  .rp-bartrack { background: #eef0f4; border-radius: 6px; height: 10px; overflow: hidden; margin: 6px 0; }
  .rp-barfill { background: linear-gradient(90deg, #6366f1, #22c55e); height: 100%; }
  .rp-bars { display: flex; flex-direction: column; gap: 7px; }
  .rp-barrow { display: grid; grid-template-columns: 220px 1fr 160px; align-items: center; gap: 10px; }
  .rp-barlabel { font-size: 13px; }
  .rp-barval { font-size: 12px; color: var(--muted); text-align: right; }
  .rp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .rp-list { margin: 0; padding-left: 18px; max-height: 240px; overflow: auto; }
  .rp-list li { font-size: 13px; margin: 3px 0; }
  .rp-trend { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rp-trend-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 13px; line-height: 1.6; }
  .rp-tips { margin: 0; padding-left: 20px; }
  .rp-tips li { margin: 6px 0; font-size: 14px; line-height: 1.6; }
  @media (max-width: 720px) {
    .rp-cards { grid-template-columns: repeat(2, 1fr); }
    .rp-barrow { grid-template-columns: 110px 1fr 92px; }
    .rp-two, .rp-trend { grid-template-columns: 1fr; }
  }

  .bottom-nav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 9px; font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; }
  .nav-item .ni-ic { font-size: 19px; line-height: 1.2; }
  .nav-item.active { color: var(--primary); font-weight: 600; }
  .more-panel { display: none; position: fixed; left: 10px; right: 10px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 45; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(15,23,42,.18); grid-template-columns: 1fr 1fr; gap: 8px; }
  .more-panel .btn { margin: 0; }

  @media (max-width: 560px) {
    .app-header { padding: 12px 14px; }
    .toolbar { display: none; }
    .summary, main, .info-banner, .sync-bar { margin-left: 14px; margin-right: 14px; }

<script>
"use strict";
/* ---------- 存储层 (IndexedDB 本地 + GitHub 云端) ---------- */
const DB_NAME = "lh_db", STORE = "data", KEY = "app";
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadLocal() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(KEY);
    req.onsuccess = () => res(req.result || { stores: [], packages: [], products: [] });
    req.onerror = () => rej(req.error);
  });
}
async function saveLocal() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(state, KEY);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------- 云端同步：GitHub Contents API ---------- */
const LS_GH = "lh_gh_cfg";
const DEFAULT_GH = { owner: "lixuefeng153", repo: "lihuo-guanjia", branch: "main", path: "sync/lh_state.json", token: "" };
let ghCfg = (() => { try { return Object.assign({}, DEFAULT_GH, JSON.parse(localStorage.getItem(LS_GH) || "{}")); } catch (e) { return Object.assign({}, DEFAULT_GH); } })();
let ghReady = false;
let ghSizeError = false;

const GH_CIPHER = "lihuo-guanjia::2026";
function ghXorBytes(str) {
  const data = new TextEncoder().encode(str);
  const key = new TextEncoder().encode(GH_CIPHER);
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
  let s = ""; for (let i = 0; i < out.length; i++) s += String.fromCharCode(out[i]);
  return s;
}
function ghXorBack(bin) {
  const data = Uint8Array.from(bin, c => c.charCodeAt(0));
  const key = new TextEncoder().encode(GH_CIPHER);
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
  return new TextDecoder().decode(out);
}
function ghEncode(plain) { return btoa(ghXorBytes(plain)); }
function ghDecode(b64) { return ghXorBack(atob(b64)); }
function ghApiUrl() {
  return `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${ghCfg.path}?ref=${encodeURIComponent(ghCfg.branch)}`;
}
function ghHeaders(extra) {
  const h = { "Accept": "application/vnd.github+json", "User-Agent": "lihuo-guanjia", "Authorization": "Bearer " + ghCfg.token };
  return Object.assign(h, extra || {});
}
function ghInit() {
  ghReady = !!(ghCfg.owner && ghCfg.repo && ghCfg.token);
  return ghReady;
}

/* ---------- 预警配置与计算 ---------- */
const LS_ALERT = "lh_alert_cfg";
let alertCfg = (() => { try { return Object.assign({ lowStock: 5, nearExpiryDays: 30, clearanceDiscount: 0.7, procureMultiplier: 2 }, JSON.parse(localStorage.getItem(LS_ALERT) || "{}")); } catch (e) { return { lowStock: 5, nearExpiryDays: 30, clearanceDiscount: 0.7, procureMultiplier: 2 }; } })();
function foldText(d) {
  const f = Math.round(Number(d) * 100) / 10;
  return (f % 1 === 0 ? String(f) : f.toFixed(1)) + "折";
}
function daysUntilExpiry(expiry) {
  if (!expiry) return null;
  const d = new Date(expiry + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}
function productAlerts(p) {
  const out = [];
  const q = Number(p.quantity) || 0;
  const ls = Number(alertCfg.lowStock);
  if (!isNaN(ls) && ls >= 0 && q <= ls) out.push({ cls: "alert-low", text: "低库存 " + q });
  const d = daysUntilExpiry(p.expiry);
  if (d !== null) {
    if (d < 0) out.push({ cls: "alert-exp", text: "已过期 " + Math.abs(d) + "天" });
    else { const ne = Number(alertCfg.nearExpiryDays); if (!isNaN(ne) && ne >= 0 && d <= ne) out.push({ cls: "alert-near", text: "临期 " + d + "天" }); }
  }
  return out;
}
function renderAlerts() {
  const bar = document.getElementById("alertBar");
  if (!bar) return;
  const items = state.products.map(p => ({ p, a: productAlerts(p) })).filter(x => x.a.length);
  if (items.length === 0) { bar.hidden = true; bar.innerHTML = ""; return; }
  const low = items.filter(x => x.a.some(t => t.cls === "alert-low")).length;
  const near = items.filter(x => x.a.some(t => t.cls === "alert-near")).length;
  const exp = items.filter(x => x.a.some(t => t.cls === "alert-exp")).length;
  const rowsHtml = items.slice(0, 50).map(x => `<li>${esc(x.p.name || "未命名产品")}<span class="prod-alerts">${x.a.map(t => `<span class="alert-tag ${t.cls}">${t.text}</span>`).join("")}</span></li>`).join("")
    + (items.length > 50 ? `<li class="rp-muted">…还有 ${items.length - 50} 个</li>` : "");
  bar.innerHTML = `<div class="alert-bar-head"><h3>⚠ 库存预警 / 临期提示</h3><button class="btn" data-action="clearance">🧹 生成清仓清单</button></div>
    <div class="alert-sum">低库存 <b>${low}</b> 个 · 临期 <b>${near}</b> 个 · 已过期 <b>${exp}</b> 个（阈值：库存≤${alertCfg.lowStock} 件、临期≤${alertCfg.nearExpiryDays} 天）</div>
    <ul class="alert-list">${rowsHtml}</ul>`;
  bar.hidden = false;
}
function openAlertSettings() {
  curEdit = { type: "alert" };
  openModal("预警设置");
  modalBody.innerHTML =
    field("低库存阈值（件）", "库存数量 ≤ 此值时提醒", `<input type="number" id="f-low" min="0" step="1" inputmode="numeric" value="${alertCfg.lowStock}" />`, "f-low")
    + field("临期提前天数", "到期日距今 ≤ 此天数时提醒", `<input type="number" id="f-near" min="0" step="1" inputmode="numeric" value="${alertCfg.nearExpiryDays}" />`, "f-near")
    + field("清仓折扣", `清仓清单「建议清仓价」= 零售价 × 折扣（当前 ${foldText(alertCfg.clearanceDiscount)}，0.7 = 7 折）`, `<input type="number" id="f-discount" min="0.05" max="1" step="0.05" inputmode="decimal" value="${alertCfg.clearanceDiscount}" />`, "f-discount")
    + field("采购目标倍数", "采购清单「目标库存」= 低库存阈值 × 倍数（当前 ×" + alertCfg.procureMultiplier + "）", `<input type="number" id="f-multi" min="0.5" max="20" step="0.5" inputmode="decimal" value="${alertCfg.procureMultiplier}" />`, "f-multi")
    + `<div class="field"><div class="hint">提示：产品的「到期日」可在新增 / 编辑产品时填写（食品等易过期品类建议填）；清仓折扣与采购倍数只影响建议值，可按实际调整。</div></div>`;
  document.getElementById("f-low").focus();
}
/* ---------- GitHub 仓库文件读写 ---------- */
async function loadRemote() {
  if (!ghReady) return null;
  try {
    const res = await fetch(ghApiUrl(), { method: "GET", headers: ghHeaders(), mode: "cors" });
    if (res.status === 404) return null;
    if (!res.ok) { console.warn("loadRemote HTTP", res.status); return null; }
    const json = await res.json();
    const plain = ghDecode((json.content || "").replace(/\s/g, ""));
    const data = JSON.parse(plain);
    return { data };
  } catch (e) { console.warn("loadRemote 失败", e); return null; }
}
async function saveRemote() {
  if (!ghReady) return false;
  try {
    const content = ghEncode(JSON.stringify(state));
    if (content.length > 900000) { ghSizeError = true; console.warn("saveRemote：数据过大，超过 GitHub 单文件限制"); return false; }
    ghSizeError = false;
    let sha = "";
    const getRes = await fetch(ghApiUrl(), { method: "GET", headers: ghHeaders(), mode: "cors" });
    if (getRes.ok) { const j = await getRes.json(); sha = j.sha || ""; }
    const body = { message: "sync: 理货管家数据更新", content: content };
    if (sha) body.sha = sha;
    let putRes = await fetch(ghApiUrl(), { method: "PUT", headers: ghHeaders({ "Content-Type": "application/json" }), mode: "cors", body: JSON.stringify(body) });
    if (putRes.status === 409) {
      const j2 = await (await fetch(ghApiUrl(), { method: "GET", headers: ghHeaders(), mode: "cors" })).json();
      body.sha = j2.sha || "";
      putRes = await fetch(ghApiUrl(), { method: "PUT", headers: ghHeaders({ "Content-Type": "application/json" }), mode: "cors", body: JSON.stringify(body) });
    }
    if (!putRes.ok) { console.warn("saveRemote HTTP", putRes.status); return false; }
    return true;
  } catch (e) { console.warn("saveRemote 失败", e); return false; }
}
async function saveData() {
  await saveLocal();
  if (ghReady) { const ok = await saveRemote(); updateSyncUI(ok); }
}
async function updateSyncUI(ok) {
  const el = document.getElementById("syncStatus");
  const btn = document.getElementById("authBtn");
  const btn2 = document.getElementById("authBtn2");
  if (!el || !btn) return;
  if (!ghReady) { el.textContent = "未连接同步（点「连接同步」）"; el.className = "sync-status warn"; btn.textContent = "连接同步"; }
  else if (ok === false) { el.textContent = "同步失败，检查网络/令牌"; el.className = "sync-status warn"; btn.textContent = "连接同步"; }
  else { el.textContent = "已同步 · GitHub"; el.className = "sync-status ok"; btn.textContent = "断开"; }
  if (btn2) btn2.textContent = btn.textContent;
}

/* ---------- 相机扫码 ---------- */
/* 设计要点：
   1) 识别引擎本地优先（zxing.min.js 随页面部署），国内网络下也不依赖 CDN；
   2) 引擎缺失时多源回退，每个源独立超时，避免"永久卡在加载中"；
   3) 原生 BarcodeDetector 先用 getSupportedFormats 探测真实能力，
      避免"对象存在但不支持任何格式"导致的静默空转；
   4) 摄像头约束逐级放宽：后置优先 -> 任意摄像头，兼容桌面设备。 */
let camStream = null, camDetector = null, camReader = null, camTimer = null;
let camPid = "__global__", camLast = "", camAlive = false;

const ZXING_SOURCES = [
  "zxing.min.js",
  "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js",
  "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"
];

function camHint(text) {
  const h = document.getElementById("camHint");
  if (!h) return;
  if (text) { h.textContent = text; h.style.display = "grid"; }
  else h.style.display = "none";
}

/* 带超时的脚本加载：CDN 挂起时不会永远卡住 */
function loadScript(src, timeoutMs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    let settled = false;
    const timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      try { s.remove(); } catch (e) {}
      reject(new Error("timeout"));
    }, timeoutMs || 8000);
    s.src = src;
    s.async = true;
    s.onload = function () { if (!settled) { settled = true; clearTimeout(timer); resolve(); } };
    s.onerror = function () {
      if (settled) return;
      settled = true; clearTimeout(timer);
      try { s.remove(); } catch (e) {}
      reject(new Error("error"));
    };
    document.head.appendChild(s);
  });
}
function zxingReady() { return !!(window.ZXing && window.ZXing.BrowserMultiFormatReader); }
async function ensureZxing() {
  if (zxingReady()) return true;
  for (let i = 0; i < ZXING_SOURCES.length; i++) {
    if (!camAlive) return false;
    try { await loadScript(ZXING_SOURCES[i], 8000); } catch (e) {}
    if (zxingReady()) return true;
  }
  return false;
}

/* 逐级放宽摄像头约束：后置优先，桌面无后置时回退任意摄像头 */
async function openCamStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const e = new Error("unsupported"); e.reason = "unsupported"; throw e;
  }
  const tries = [
    { video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false },
    { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: true, audio: false }
  ];
  let last = null;
  for (let i = 0; i < tries.length; i++) {
    try { return await navigator.mediaDevices.getUserMedia(tries[i]); }
    catch (e) { last = e; }
  }
  throw last || new Error("no camera");
}

/* 创建原生 BarcodeDetector；不支持时返回 null */
async function createDetector() {
  if (!("BarcodeDetector" in window)) return null;
  const WANT = ["code_128", "code_39", "code_93", "codabar", "ean_13", "ean_8",
                "upc_a", "upc_e", "itf", "qr_code", "data_matrix", "pdf417", "aztec"];
  try {
    let supported = null;
    if (typeof BarcodeDetector.getSupportedFormats === "function") {
      try { supported = await BarcodeDetector.getSupportedFormats(); } catch (e) { supported = null; }
    }
    let use = WANT;
    if (Array.isArray(supported) && supported.length) {
      use = WANT.filter(function (f) { return supported.indexOf(f) >= 0; });
      if (!use.length) return null;   // 明确不支持 -> 交给 ZXing，避免静默空转
    }
    return new BarcodeDetector({ formats: use });
  } catch (e) { return null; }
}

async function openCameraScan(pid) {
  camPid = pid || "__global__";
  camAlive = true;
  document.getElementById("cameraModal").classList.add("open");
  camHint("正在启动摄像头…");
  try {
    camStream = await openCamStream();
  } catch (e) {
    camAlive = false;
    const n = (e && e.name) ? e.name : "";
    let msg = "无法打开摄像头：";
    if (n === "NotAllowedError" || n === "SecurityError")
      msg += "权限被拒绝。请点击地址栏的摄像头图标允许权限后重试。";
    else if (n === "NotFoundError" || n === "DevicesNotFoundError")
      msg += "未检测到摄像头设备。";
    else if (n === "NotReadableError" || n === "TrackStartError")
      msg += "摄像头被其他程序占用，请关闭后重试。";
    else if (!window.isSecureContext)
      msg += "当前不是安全环境。浏览器要求通过 HTTPS 或 localhost 访问才允许使用摄像头。";
    else
      msg += ((e && e.message) ? e.message : "未知错误。");
    camHint(msg);
    return;
  }
  try {
    const video = document.getElementById("camVideo");
    video.srcObject = camStream;
    // iOS Safari 必须加 playsinline + muted，否则视频会强制全屏且无法自动播放
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.muted = true;
    // 先播放，让取景画面立刻显示出来（ZXing 路径会在接入引擎前重新暂停一次）
    try { await video.play(); } catch (e) {}
    camHint("");

    const det = await createDetector();
    if (det) {
      startNativeDetect(video, det);
      return;
    }
    camHint("正在加载识别引擎…");
    const ok = await ensureZxing();
    if (!camAlive || !camStream) return;
    if (!ok) {
      camHint("识别引擎加载失败：本地引擎缺失且网络不可达。请检查网络后重试，或改用扫码枪手动输入。");
      return;
    }
    camHint("");
    await startZxing(video);
  } catch (e) {
    camHint("视频预览启动失败：" + ((e && e.message) || e));
  }
}

/* 原生 BarcodeDetector 识别循环（video 由页面自行播放） */
function startNativeDetect(video, det) {
  stopCamDetect();
  camDetector = det;
  camHint("");
  const tick = async function () {
    if (!camAlive || !camStream) return;
    try {
      const codes = await camDetector.detect(video);
      if (codes && codes.length && codes[0].rawValue) { onCamCode(codes[0].rawValue); return; }
    } catch (e) {}
    if (camAlive) camTimer = setTimeout(tick, 150);
  };
  tick();
}

async function startZxing(video) {
  try {
    // 使用默认配置（不传 hints）：实测默认 MultiFormatReader 的 5 个解码器
    // 已覆盖一维码全家 + QR/DataMatrix/Aztec/PDF417，且识别稳定；
    // 传 TRY_HARDER/POSSIBLE_FORMATS 的组合在部分版本上反而会识别失败。
    camReader = new ZXing.BrowserMultiFormatReader();
    const onResult = function (result, err) {
      if (result && result.getText && result.getText()) onCamCode(result.getText());
    };
    // 关键：ZXing 0.21.3 中 decodeFromVideoElement 已废弃，
    // 其内部抓帧会得到全黑画面导致永远识别不到；
    // 必须改用 decodeFromStream，把已打开的 MediaStream 直接交给引擎。
    if (camStream && typeof camReader.decodeFromStream === "function") {
      // 保险：先暂停，确保 ZXing 内部 play() 能触发 playing 事件从而启动解码循环
      try { video.pause(); } catch (e) {}
      await camReader.decodeFromStream(camStream, video, onResult);
    } else {
      camReader.decodeFromVideoElement(video, onResult);
    }
  } catch (e) {
    // 用户中途关闭等情况会中断，属正常，不必提示
    if (!camAlive) return;
    camHint("识别引擎启动失败：" + ((e && e.message) || e));
  }
}

function onCamCode(code) {
  const c = String(code || "").trim();
  if (!c || c === camLast) return;
  camLast = c;
  setTimeout(function () { camLast = ""; }, 1200); /* 短去抖，避免同一码重复触发 */
  const pid = camPid;
  closeCameraScan();
  const inp = document.getElementById("scanInput-" + pid);
  if (inp) inp.value = c;
  doScan(c, pid);
  toast("相机识别成功：" + c);
}

function stopCamDetect() {
  if (camTimer) { clearTimeout(camTimer); camTimer = null; }
  if (camReader) { try { camReader.reset(); } catch (e) {} camReader = null; }
  camDetector = null;
}

function closeCameraScan() {
  camAlive = false;
  stopCamDetect();
  if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
  const video = document.getElementById("camVideo");
  if (video) video.srcObject = null;
  const m = document.getElementById("cameraModal");
  if (m) m.classList.remove("open");
}
document.getElementById("cameraModal").addEventListener("click", (e) => { if (e.target && e.target.id === "cameraModal") closeCameraScan(); });
document.getElementById("cameraClose").addEventListener("click", closeCameraScan);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCameraScan(); });

/* ---------- 移动端底部导航 ---------- */
const morePanel = document.getElementById("morePanel");
function setNavActive(key) {
  document.querySelectorAll(".nav-item[data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === key));
}
function toggleMorePanel() { if (morePanel) morePanel.classList.toggle("open"); }

/* ---------- 工具 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = (n) => "¥" + (Number(n) || 0).toFixed(2);
const pct = (n) => (Number(n) * 100).toFixed(1) + "%";
const num = (v) => { const x = parseFloat(String(v).replace(/[^\d.\-]/g, "")); return isNaN(x) ? 0 : x; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 一维码 (Code128) 渲染 ---------- */
const CATS = ["食品", "玩具", "文具", "文创", "盲抽盲盒", "潮流"];
const CODE128 = [
  "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
  "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
  "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
  "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
  "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
  "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
  "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
  "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
  "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
  "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
  "114131","311141","411131","211412","211214","211232","2331112"
];
function code128Codes(text) {
  text = String(text);
  const codes = [];
  let i = 0;
  const startC = text.length >= 2 && /^\d\d/.test(text);
  let set = startC ? "C" : "B";
  codes.push(startC ? 105 : 104);
  while (i < text.length) {
    if (set === "C") {
      if (i + 1 < text.length && /^\d\d$/.test(text.substr(i, 2))) {
        codes.push(parseInt(text.substr(i, 2), 10));
        i += 2;
      } else { codes.push(100); set = "B"; }
    } else {
      const rem = text.substr(i);
      if (/^\d{4,}/.test(rem)) { codes.push(99); set = "C"; }
      else {
        let c = text.charCodeAt(i);
        if (c < 32 || c > 126) c = 32;
        codes.push(c - 32);
        i++;
      }
    }
  }
  let sum = codes[0];
  for (let k = 1; k < codes.length; k++) sum += codes[k] * k;
  codes.push(sum % 103);
  codes.push(106);
  return codes;
}
function renderBarcode(value) {
  if (!value) return "";
  const codes = code128Codes(value);
  let bars = [];
  codes.forEach(c => {
    const pat = CODE128[c];
    for (let j = 0; j < pat.length; j++) bars.push({ w: +pat[j], on: j % 2 === 0 });
  });
  const QZ = 10;
  let x = QZ;
  let rects = "";
  bars.forEach(b => {
    if (b.on) rects += `<rect x="${x}" y="0" width="${b.w}" height="38" fill="#111827"/>`;
    x += b.w;
  });
  const w = x + QZ, h = 54;
  return `<svg class="barcode" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="条码 ${esc(value)}">${rects}<text x="${w / 2}" y="${h - 3}" text-anchor="middle" font-size="11" fill="#1f2933" font-family="monospace">${esc(value)}</text></svg>`;
}
function catOptions(sel) {
  let o = `<option value="">未分类</option>`;
  CATS.forEach(c => { o += `<option value="${c}"${c === sel ? " selected" : ""}>${c}</option>`; });
  return o;
}

/* 图片压缩：长边限制 + JPEG 重编码，高清且低储存 */
const IMG_MAX = 1280, IMG_Q = 0.82;
async function compressImage(file) {
  let source, w, h;
  if (window.createImageBitmap) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    source = bmp; w = bmp.width; h = bmp.height;
  } else {
    const u = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; });
    source = img; w = img.naturalWidth; h = img.naturalHeight;
  }
  const scale = Math.min(1, IMG_MAX / Math.max(w, h));
  const tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement("canvas");
  canvas.width = tw; canvas.height = th;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, tw, th);
  ctx.drawImage(source, 0, 0, tw, th);
  if (source.close) source.close();
  return canvas.toDataURL("image/jpeg", IMG_Q);
}

/* ---------- 状态 ---------- */
let state = { stores: [], packages: [], products: [] };
const collapsed = new Set(); // 折叠的供应商/包裹 id

/* ---------- 计算 ---------- */
const pkgItems = (pkgId) => state.products.filter(p => p.packageId === pkgId);
const pkgTotalQty = (pkgId) => pkgItems(pkgId).reduce((s, p) => s + (Number(p.quantity) || 0), 0);
function perItemFee(pkg) { const n = pkgTotalQty(pkg.id); return n > 0 ? (Number(pkg.logisticsFee) || 0) / n : 0; }
function productCost(p) {
  const pkg = state.packages.find(x => x.id === p.packageId);
  return (Number(p.purchasePrice) || 0) + (pkg ? perItemFee(pkg) : 0);
}
const productProfit = (p) => (Number(p.retailPrice) || 0) - productCost(p);
function productMargin(p) { const rp = Number(p.retailPrice) || 0; return rp > 0 ? productProfit(p) / rp : 0; }

function computeSummary() {
  let cost = 0, fee = 0, retail = 0, qty = 0;
  state.packages.forEach(pkg => { fee += Number(pkg.logisticsFee) || 0; });
  state.products.forEach(p => {
    const q = Number(p.quantity) || 0; qty += q;
    cost += (Number(p.purchasePrice) || 0) * q;
    retail += (Number(p.retailPrice) || 0) * q;
  });
  const totalCost = cost + fee;
  const profit = retail - totalCost;
  const margin = retail > 0 ? profit / retail : 0;
  return { cost, fee, retail, totalCost, profit, margin, storeCount: state.stores.length, pkgCount: state.packages.length, productCount: state.products.length, qty };
}

/* ---------- 渲染 ---------- */
function renderSummary() {
  const s = computeSummary();
  const sign = s.profit < 0 ? "-" : "";
  document.getElementById("summary").innerHTML = `
    <div class="stat-card accent"><div class="label">总进货成本</div><div class="value">${money(s.cost)}</div><div class="sub">${s.productCount} 种 · ${s.qty} 件</div></div>
    <div class="stat-card"><div class="label">总物流费用</div><div class="value">${money(s.fee)}</div><div class="sub">${s.pkgCount} 个包裹</div></div>
    <div class="stat-card accent"><div class="label">预计零售总额</div><div class="value">${money(s.retail)}</div><div class="sub">${s.storeCount} 个供应商</div></div>
    <div class="stat-card profit"><div class="label">总毛利</div><div class="value">${sign}${money(Math.abs(s.profit))}</div><div class="sub">${s.profit < 0 ? "亏损" : "盈利"}</div></div>
    <div class="stat-card profit"><div class="label">整体毛利率</div><div class="value">${pct(s.margin)}</div><div class="sub">毛利 ÷ 零售额</div></div>
  `;
}

function renderStores() {
  const root = document.getElementById("storeList");
  if (state.stores.length === 0) {
    root.innerHTML = `<div class="empty-state"><div class="big">还没有供应商</div><div>点击右上角「+ 新增供应商」开始理货吧。</div></div>`;
    return;
  }
  root.innerHTML = state.stores.map(store => {
    const pkgs = state.packages.filter(p => p.storeId === store.id);
    const itemCount = pkgs.reduce((s, p) => s + pkgItems(p.id).length, 0);
    const exp = !collapsed.has(store.id);
    const pkgHtml = pkgs.length === 0
      ? `<div class="pkg-empty">该供应商暂无包裹，点击下方「+ 包裹」添加。</div>`
      : pkgs.map(pkg => renderPackage(pkg)).join("");
    return `
    <section class="store" data-id="${store.id}">
      <div class="store-head">
        <button class="toggle" data-action="toggle-store" data-id="${store.id}" aria-expanded="${exp}" aria-label="${exp ? "收起" : "展开"}供应商">${exp ? "▾" : "▸"}</button>
        <h2 class="store-title">${esc(store.name)}</h2>
        <span class="store-meta">${pkgs.length} 个包裹 · ${itemCount} 件产品</span>
        <div class="store-actions">
          <button class="btn" data-action="edit-store" data-id="${store.id}">编辑</button>
          <button class="btn primary" data-action="add-package" data-id="${store.id}">+ 包裹</button>
        </div>
      </div>
      ${exp ? `<div class="store-body">${pkgHtml}<div style="margin-top:10px"><button class="btn primary" data-action="add-package" data-id="${store.id}">+ 新增包裹</button></div></div>` : ""}
    </section>`;
  }).join("");
}

function renderPackage(pkg) {
  const items = pkgItems(pkg.id);
  const qty = pkgTotalQty(pkg.id);
  const feeEach = perItemFee(pkg);
  const exp = !collapsed.has(pkg.id);
  const retail = items.reduce((s, p) => s + (Number(p.retailPrice) || 0) * (Number(p.quantity) || 0), 0);
  const cost = items.reduce((s, p) => s + (Number(p.purchasePrice) || 0) * (Number(p.quantity) || 0), 0);
  const profit = retail - cost - (Number(pkg.logisticsFee) || 0);
  const prodHtml = items.length === 0
    ? `<div class="pkg-empty">该包裹暂无产品。</div>`
    : `<div class="products">${items.map(renderProduct).join("")}</div>`;
  return `
  <div class="package" data-id="${pkg.id}">
    <div class="pkg-head">
      <button class="toggle" data-action="toggle-package" data-id="${pkg.id}" aria-expanded="${exp}" aria-label="${exp ? "收起" : "展开"}包裹">${exp ? "▾" : "▸"}</button>
      <h3 class="pkg-title">${esc(pkg.name || "未命名包裹")}</h3>
      <span class="pkg-meta">运费 ${money(pkg.logisticsFee)} · ${qty} 件 · 每件摊 ${money(feeEach)}</span>
      <div class="pkg-actions">
        <button class="btn" data-action="edit-package" data-id="${pkg.id}">编辑</button>
        <button class="btn danger" data-action="del-package" data-id="${pkg.id}">删除</button>
        <button class="btn primary" data-action="add-product" data-id="${pkg.id}">+ 产品</button>
      </div>
    </div>
    ${exp ? `<div class="pkg-body">
      ${scanPanelHtml(pkg.id)}
      ${prodHtml}
      <div class="pkg-subtotal">
        <span>进货小计 <b>${money(cost)}</b></span>
        <span>运费 <b>${money(pkg.logisticsFee)}</b></span>
        <span>零售小计 <b>${money(retail)}</b></span>
        <span>包裹毛利 <b style="color:${profit < 0 ? "var(--loss)" : "var(--profit)"}">${money(profit)}</b></span>
      </div>
    </div>` : ""}
  </div>`;
}

function renderProduct(p) {
  const q = Number(p.quantity) || 0;
  const cost = productCost(p), profit = productProfit(p), margin = productMargin(p);
  const rp = Number(p.retailPrice) || 0;
  const img = p.image
    ? `<img src="${p.image}" alt="${esc(p.name)}的产品图片" />`
    : `<div class="no-img">无图</div>`;
  const tags = [];
  if (p.category) tags.push(`<span class="tag cat">${esc(p.category)}</span>`);
  if (p.model) tags.push(`<span class="tag">型号 ${esc(p.model)}</span>`);
  if (p.material) tags.push(`<span class="tag">材质 ${esc(p.material)}</span>`);
  if (p.ageRange) tags.push(`<span class="tag">${esc(p.ageRange)}</span>`);
  const tagHtml = tags.length ? `<div class="prod-tags">${tags.join("")}</div>` : "";
  const barcodeHtml = p.barcode ? `<div class="prod-barcode">${renderBarcode(p.barcode)}</div>` : "";
  const alerts = productAlerts(p);
  const alertHtml = alerts.length ? `<div class="prod-alerts">${alerts.map(t => `<span class="alert-tag ${t.cls}">${t.text}</span>`).join("")}</div>` : "";
  return `
  <div class="product" data-id="${p.id}">
    <div class="prod-img">${img}</div>
    <div class="prod-info">
      <div class="prod-name">${esc(p.name)}</div>
      ${tagHtml}
      <div class="prod-nums">进货 ${money(p.purchasePrice)} · 零售 ${money(p.retailPrice)} · 数量 ${q}</div>

/* ---------- 扫码入库 (包裹级) ---------- */
function scanPanelHtml(pid) {
  return `<section class="scan-in" data-pkg="${pid}" aria-label="本包裹扫码入库">
    <div class="scan-in-row">
      <span class="scan-in-label">扫码入库</span>
      <input type="text" id="scanInput-${pid}" class="scan-in-input" placeholder="聚焦后用扫码枪扫入条码，或手动输入后回车" autocomplete="off" />
      <button class="btn cam-btn" data-action="scan-camera" data-pkg="${pid}" title="相机扫码" aria-label="相机扫码"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>相机</button>

}
function findProductByBarcode(code) {
  const c = String(code || "").trim();
  return state.products.find(p => p.barcode && p.barcode.trim() === c);
}
function renderScanResult(code, pid) {
  const box = document.getElementById("scanResult-" + pid);
  if (!box) return;
  const c = String(code || "").trim();
  const matches = state.products.filter(p => p.barcode && p.barcode.trim() === c);
  if (matches.length > 0) {
    const cards = matches.map(prod => {
      const pkg = state.packages.find(x => x.id === prod.packageId);
      const store = pkg ? state.stores.find(s => s.id === pkg.storeId) : null;
      const q = Number(prod.quantity) || 0;
      return `
      <div class="scan-card">
        <div>
          <div class="sc-name">${esc(prod.name)}</div>
          <div class="sc-meta">${store ? esc(store.name) + " / " : ""}${pkg ? esc(pkg.name || "未命名包裹") : ""} · 批发 ${money(prod.purchasePrice)} · 零售 ${money(prod.retailPrice)} · 库存 ${q} 件</div>
        </div>
        <div class="scan-stepper">
          <input type="number" id="scanQty-${pid}-${prod.id}" min="1" step="1" value="1" />
          <button class="btn primary" data-action="scan-stock-add" data-id="${prod.id}" data-pkg="${pid}">入库 +</button>
        </div>
      </div>`;
    }).join("");
    const hint = matches.length > 1
      ? `<div class="rp-note" style="margin-bottom:6px">该条码对应 <b>${matches.length}</b> 个产品（不同供应商 / 包裹，批发价不同），请选择要入库的那一家。</div>`
      : `<div class="rp-note" style="margin-bottom:6px">请确认下方供应商 / 包裹与批发价正确后再入库。</div>`;
    box.innerHTML = hint + cards;
  } else if (pid === "__global__") {
    box.innerHTML = `
      <div class="scan-card">
        <div class="scan-empty">未找到条码为 <b>${esc(code)}</b> 的产品。请先在对应包裹的扫码框「新建产品」录入一次，之后就能全局扫码入库。</div>
      </div>`;
  } else {
    box.innerHTML = `
      <div class="scan-card">
        <div class="scan-empty">未找到条码为 <b>${esc(code)}</b> 的产品。
          <button class="btn primary" data-action="scan-create" data-code="${esc(code)}" data-pkg="${pid}">在本包裹新建产品带入条码</button>
        </div>
      </div>`;
  }
}
function doScan(code, pid) {
  const c = String(code || "").trim();
  if (!c) return;
  renderScanResult(c, pid);
  const inp = document.getElementById("scanInput-" + pid);
  if (inp) inp.focus();
}
function scanAddStock(id, qty, pid) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const add = Math.max(1, Math.floor(Number(qty)) || 1);
  p.quantity = (Number(p.quantity) || 0) + add;
  if (!Array.isArray(p.stockLog)) p.stockLog = [];
  p.stockLog.push({ at: Date.now(), qty: add, init: false });
  saveData().then(() => {
    renderAll();
    toast("已入库，库存 " + p.quantity + " 件");
    const inp = document.getElementById("scanInput-" + pid);
    if (inp) { inp.value = ""; inp.focus(); }
  });
}
function scanCreateProduct(code, pid) {
  if (!pid) { toast("请先建立一个包裹再来入库"); return; }
  openProductForm(pid, null);
  const bi = document.getElementById("f-barcode");
  if (bi) { bi.value = code; }
  const pv = document.getElementById("barcodePreview");
  if (pv) pv.innerHTML = renderBarcode(code);
  checkBarcodeDup(code);
  prefillFromBarcode();
}
function checkBarcodeDup(code) {
  const c = String(code || "").trim();
  const warn = document.getElementById("barcodeDup");
  if (!warn) return;
  if (!c) { warn.style.display = "none"; return; }
  const dup = state.products.find(p => p.barcode && p.barcode.trim() === c && p.id !== (curEdit.id || ""));
  warn.style.display = dup ? "block" : "none";
}
/* 取该码最近创建的产品，用于「新建产品」自动带入默认值 */
function lastProductByBarcode(code) {
  const c = String(code || "").trim();
  if (!c) return null;
  let best = null, bestT = -1;
  state.products.forEach(p => {
    if (p.barcode && p.barcode.trim() === c && (Number(p.createdAt) || 0) >= bestT) {
      best = p; bestT = Number(p.createdAt) || 0;
    }
  });
  return best;
}
/* 新建产品时按同码最近产品预填：只填空字段，不覆盖已输入内容；图片在无图时带入 */
function prefillFromBarcode() {
  const bi = document.getElementById("f-barcode");
  if (!bi) return;
  const src = lastProductByBarcode(bi.value);
  if (!src) return;
  const set = (id, val) => { const el = document.getElementById(id); if (el && el.value === "") el.value = val == null ? "" : val; };
  set("f-name", src.name || "");
  set("f-buy", src.purchasePrice == null ? "" : src.purchasePrice);
  set("f-sell", src.retailPrice == null ? "" : src.retailPrice);
  set("f-cat", src.category || "");
  set("f-material", src.material || "");
  set("f-age", src.ageRange || "");
  set("f-model", src.model || "");
  set("f-expiry", src.expiry || "");
  if (src.image && !curEdit.image) {
    curEdit.image = src.image;
    curEdit.imageName = src.imageName || "";
    const pv = document.getElementById("imgPreview");
    if (pv) pv.innerHTML = `<img src="${src.image}" alt="预览" />`;
  }
}
function fillBarcodeFromScan(val) {
  const code = String(val || "").trim(); if (!code) return;
  const bi = document.getElementById("f-barcode");
  if (bi) { bi.value = code; }
  const pv = document.getElementById("barcodePreview");
  if (pv) pv.innerHTML = renderBarcode(code);
  checkBarcodeDup(code);
}

  });
  scanBox.addEventListener("blur", () => { if (scanBox.value.trim()) { fillBarcodeFromScan(scanBox.value); scanBox.value = ""; } });

  fileInput.addEventListener("change", async () => {

    + field("个人访问令牌", "GitHub → Settings → Developer settings → PAT（需 repo 权限），以 ghp_ 开头", `<input type="password" id="f-token" value="" placeholder="ghp_xxxxxxxx" />`, "f-token")
    + `<div class="field"><div class="hint">用 GitHub 仓库文件保存同步数据（公开仓库中数据经简单加密，非明文）。首次连接会在仓库新建 sync/lh_state.json。令牌仅存于本机浏览器，不上传任何服务器。</div></div>`;

async function saveForm() {
  if (!curEdit) return;
  if (curEdit.type === "gh") {
    const owner = document.getElementById("f-owner").value.trim();
    const repo = document.getElementById("f-repo").value.trim();
    const token = document.getElementById("f-token").value.trim();
    if (!owner || !repo || !token) { toast("请填写用户名、仓库名和令牌"); return; }
    ghCfg = Object.assign({}, DEFAULT_GH, { owner, repo, token });
    localStorage.setItem(LS_GH, JSON.stringify(ghCfg));
    if (!ghInit()) { toast("GitHub 初始化失败，请检查填写"); return; }
    const probe = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { method: "GET", headers: ghHeaders(), mode: "cors" });
    if (probe.status === 401) { toast("令牌无效或已过期"); return; }
    if (probe.status === 403) { toast("令牌权限不足，需 repo 权限"); return; }
    if (probe.status === 404) { toast("仓库不存在或无访问权限"); return; }
    const remote = await loadRemote();
    const localEmpty = !(state.stores.length || state.packages.length || state.products.length);
    if (remote && remote.data && Array.isArray(remote.data.products) && localEmpty) { state = remote.data; await saveLocal(); renderAll(); }
    const ok = await saveRemote();
    let msg = "已连接 GitHub 同步" + (ok ? "，数据已保存到仓库" : "，保存失败");
    if (!ok && ghSizeError) msg = "保存失败：数据超过 GitHub 单文件 1MB 限制（多为商品图片），建议减少图片或改回 CloudBase";
    closeModal(); updateSyncUI(ok); toast(msg);
    return;
  }
  if (curEdit.type === "store") {
    const name = document.getElementById("f-name").value.trim();
    if (!name) { toast("请填写供应商名称"); return; }
    if (curEdit.id) { const s = state.stores.find(x => x.id === curEdit.id); s.name = name; }
    else state.stores.push({ id: uid(), name, createdAt: Date.now() });
  } else if (curEdit.type === "package") {
    const name = document.getElementById("f-name").value.trim();
    const fee = Math.max(0, num(document.getElementById("f-fee").value));
    if (curEdit.id) { const p = state.packages.find(x => x.id === curEdit.id); p.name = name; p.logisticsFee = fee; }
    else state.packages.push({ id: uid(), storeId: curEdit.storeId, name, logisticsFee: fee, createdAt: Date.now() });
  } else if (curEdit.type === "product") {
    const name = document.getElementById("f-name").value.trim();
    if (!name) { toast("请填写产品名称"); return; }
    const buy = Math.max(0, num(document.getElementById("f-buy").value));
    const sell = Math.max(0, num(document.getElementById("f-sell").value));
    const qty = Math.max(1, Math.floor(num(document.getElementById("f-qty").value)) || 1);
    const model = document.getElementById("f-model").value.trim();
    const category = document.getElementById("f-cat").value;
    const material = document.getElementById("f-material").value.trim();
    const ageRange = document.getElementById("f-age").value.trim();
    const barcode = document.getElementById("f-barcode").value.trim();
    const expiry = document.getElementById("f-expiry").value.trim();
    /* 同一条码共用同一张图片：已有同码产品带图则复用，避免重复 base64 占用存储 */
    const shared = state.products.find(o => o.id !== (curEdit.id || "") && o.barcode && o.barcode.trim() === barcode && o.image);
    const image = shared ? shared.image : curEdit.image;
    const imageName = shared ? shared.imageName : curEdit.imageName;
    if (curEdit.id) {
      const p = state.products.find(x => x.id === curEdit.id);
      Object.assign(p, { name, purchasePrice: buy, retailPrice: sell, quantity: qty, model, category, material, ageRange, barcode, expiry, image, imageName });
    } else {
      const now = Date.now();
      state.products.push({ id: uid(), packageId: curEdit.packageId, name, purchasePrice: buy, retailPrice: sell, quantity: qty, model, category, material, ageRange, barcode, expiry, image, imageName, createdAt: now, stockLog: [{ at: now, qty: qty, init: true }] });
    }
    if (curEdit.type === "alert") {
      const low = Math.max(0, Math.floor(num(document.getElementById("f-low").value)) || 0);
      const near = Math.max(0, Math.floor(num(document.getElementById("f-near").value)) || 0);
      const discount = Math.min(1, Math.max(0.05, num(document.getElementById("f-discount").value) || 0.7));
      const multi = Math.min(20, Math.max(0.5, num(document.getElementById("f-multi").value) || 2));
      alertCfg = { lowStock: low, nearExpiryDays: near, clearanceDiscount: discount, procureMultiplier: multi };
      localStorage.setItem(LS_ALERT, JSON.stringify(alertCfg));
      closeModal(); renderAll(); toast("预警设置已保存"); return;
    }
  }
  saveData().then(() => { renderAll(); closeModal(); toast("已保存"); });
}

/* ---------- 删除（上限：单个包裹；供应商整体删除已移除，防止误删级联） ---------- */

}
async function delProduct(id) {
  const ok = await openConfirm({ title: "删除产品", message: "确定删除该产品？", danger: true });
  if (!ok) return;
  state.products = state.products.filter(p => p.id !== id);

}

function dateStr() { return new Date().toISOString().slice(0, 10); }

const EXPORT_COLS = ["供应商", "包裹编号", "物流费用", "产品名称", "产品型号", "类别", "材质", "适用年龄", "一维码", "数量", "进货单价", "零售价", "单件运费", "单件成本含运费", "单件毛利", "毛利率", "小计零售", "小计毛利", "图片", "到期日"];

function buildRows() {
  const rows = [];
  state.stores.forEach(store => {
    const pkgs = state.packages.filter(p => p.storeId === store.id);
    pkgs.forEach(pkg => {
      const items = pkgItems(pkg.id);
      if (items.length === 0) {
        rows.push({ 供应商: store.name, 包裹编号: pkg.name || "", 物流费用: pkg.logisticsFee, 产品名称: "", 产品型号: "", 类别: "", 材质: "", 适用年龄: "", 一维码: "", 数量: "", 进货单价: "", 零售价: "", 单件运费: perItemFee(pkg).toFixed(2), 单件成本含运费: "", 单件毛利: "", 毛利率: "", 小计零售: "", 小计毛利: "", 图片: "", id_store: store.id, id_pkg: pkg.id, id_prod: "" });
      }
      items.forEach(p => {
        const q = Number(p.quantity) || 0, rp = Number(p.retailPrice) || 0, profit = productProfit(p);
        rows.push({
          供应商: store.name, 包裹编号: pkg.name || "", 物流费用: pkg.logisticsFee,
          产品名称: p.name, 产品型号: p.model || "", 类别: p.category || "", 材质: p.material || "", 适用年龄: p.ageRange || "", 一维码: p.barcode || "",
          数量: q, 进货单价: p.purchasePrice, 零售价: p.retailPrice,
          单件运费: perItemFee(pkg).toFixed(2), 单件成本含运费: productCost(p).toFixed(2),
          单件毛利: profit.toFixed(2), 毛利率: pct(productMargin(p)),
          小计零售: (rp * q).toFixed(2), 小计毛利: (profit * q).toFixed(2),
          /* 图片是 base64 dataURL（数万字符），塞进单元格会超过 Excel 的
             32,767 字符上限导致整个文件被判损坏打不开；改为有无标记 */
          图片: p.image ? "有" : "", 到期日: p.expiry || "", id_store: store.id, id_pkg: pkg.id, id_prod: p.id
        });
      });
    });
  });
  return rows;
}

function exportXlsx() {
  try {
    const rows = buildRows();
    const s = computeSummary();
    const summaryRows = [
      { 指标: "总进货成本", 数值: s.cost },
      { 指标: "总物流费用", 数值: s.fee },
      { 指标: "预计零售总额", 数值: s.retail },
      { 指标: "总毛利", 数值: s.profit },
      { 指标: "整体毛利率", 数值: pct(s.margin) },
      { 指标: "供应商数", 数值: s.storeCount },
      { 指标: "包裹数", 数值: s.pkgCount },
      { 指标: "产品种类数", 数值: s.productCount },
      { 指标: "总件数", 数值: s.qty }
    ];
    // 使用纯原生生成器，零外部依赖
    NativeXLSX([
      { name: "理货明细", headers: EXPORT_COLS, rows: rows },
      { name: "汇总", headers: ["指标", "数值"], rows: summaryRows }
    ], `理货数据_${dateStr()}.xlsx`);
    toast("已导出 Excel");
  } catch (e) {
    console.error("exportXlsx 失败", e);
    toast("Excel 导出失败：" + ((e && e.message) || e) + "，已自动改用 CSV");
    try { exportCsv(); } catch (e2) { console.error(e2); }
  }
}

function exportCsv() {
  const rows = buildRows();
  const lines = [EXPORT_COLS.join(",")];
  rows.forEach(r => {
    const cells = EXPORT_COLS.map(k => {
      let v = r[k];
      if (v === "" || v == null) v = "";
      v = String(v).replace(/"/g, '""');
      return /[",\n]/.test(v) ? `"${v}"` : v;
    });
    lines.push(cells.join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  downloadBlob(blob, `理货数据_${dateStr()}.csv`);
  toast("已导出 CSV");
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click();
  // 延迟释放：立即 revoke 在部分浏览器（尤其移动端）会中断尚未开始的下载
  setTimeout(function () { try { document.body.removeChild(a); } catch (e) {} URL.revokeObjectURL(url); }, 1000);
}

/* ---------- 纯原生 XLSX 生成器（零外部依赖） ----------
   xlsx 本质 = ZIP 包含 XML 文件。本实现仅依赖浏览器原生 Blob/Uint8Array/TextEncoder，
   不依赖任何 CDN 或本地库文件，彻底消除「库加载失败导致导出降级 CSV」的问题。
   用法：nativeXlsx([{name:'Sheet1', headers:['列A','列B'], rows:[[值1,值2]]}], '文件名.xlsx') */
var NativeXLSX = (function () {
  /* ---- 工具函数 ---- */
  function escXml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function rpad(s, n, c) { s = String(s); while (s.length < n) s += (c || " "); return s; }
  var CRC_TABLE = (function () {
    var t = new Int32Array(256), i, j, c;
    for (i = 0; i < 256; i++) { c = i; for (j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c; }
    return t;
  })();
  function crc32(buf) {
    var crc = -1, off = 0, len = buf.length;
    while (len--) crc = CRC_TABLE[(crc ^ buf[off++]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ (-1)) >>> 0;
  }
  function toUtf8(s) { return new TextEncoder().encode(String(s)); }
  /* DOS 时间/日期（ZIP 头用），只算一次，保证各头一致 */
  var DOS_TIME = (function () {
    var d = new Date();
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
    };
  })();
  /* 列名：0->A, 25->Z, 26->AA ... */
  function colName(n) {
    var s = "";
    n = n + 1;
    while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  /* ---- ZIP 局部文件头 + 数据（30 字节定长头，字段位置严格按规范） ---- */
  function localFile(path, data) {
    var pathBytes = toUtf8(path);
    var hbuf = new Uint8Array(30 + pathBytes.length);
    var v = new DataView(hbuf.buffer);
    v.setUint32(0, 0x04034b50, true);      // signature
    v.setUint16(4, 20, true);              // version needed
    v.setUint16(6, 0, true);               // flags
    v.setUint16(8, 0, true);               // compression: stored
    v.setUint16(10, DOS_TIME.time, true);  // mod time
    v.setUint16(12, DOS_TIME.date, true);  // mod date
    v.setUint32(14, crc32(data), true);    // crc-32
    v.setUint32(18, data.length, true);    // compressed size
    v.setUint32(22, data.length, true);    // uncompressed size
    v.setUint16(26, pathBytes.length, true); // filename length
    v.setUint16(28, 0, true);              // extra field length
    hbuf.set(pathBytes, 30);
    return [hbuf, data];
  }

  /* ---- ZIP 中央目录（46 字节定长头） ---- */
  function centralFile(path, data, offset) {
    var pathBytes = toUtf8(path);
    var hbuf = new Uint8Array(46 + pathBytes.length);
    var v = new DataView(hbuf.buffer);
    v.setUint32(0, 0x02014b50, true);      // signature
    v.setUint16(4, 20, true);              // version made by
    v.setUint16(6, 20, true);              // version needed
    v.setUint16(8, 0, true);               // flags
    v.setUint16(10, 0, true);              // compression: stored
    v.setUint16(12, DOS_TIME.time, true);  // mod time
    v.setUint16(14, DOS_TIME.date, true);  // mod date
    v.setUint32(16, crc32(data), true);    // crc-32
    v.setUint32(20, data.length, true);    // compressed size
    v.setUint32(24, data.length, true);    // uncompressed size
    v.setUint16(28, pathBytes.length, true); // filename length
    v.setUint16(30, 0, true);              // extra field length
    v.setUint16(32, 0, true);              // file comment length
    v.setUint16(34, 0, true);              // disk number start
    v.setUint16(36, 0, true);              // internal attrs
    v.setUint32(38, 0, true);              // external attrs
    v.setUint32(42, offset, true);         // 局部头相对偏移（关键：在 42 字节处）
    hbuf.set(pathBytes, 46);
    return hbuf;
  }

  /* ---- ZIP 结束标记 ---- */
  function endOfCentral(numEntries, centralSize, centralOffset) {
    var buf = new Uint8Array(22);
    var v = new DataView(buf.buffer);
    v.setUint32(0, 0x06054b50, true);  // signature
    v.setUint16(4, 0, true);              // disk number
    v.setUint16(6, 0, true);              // disk with central dir
    v.setUint16(8, numEntries, true);      // entries on this disk
    v.setUint16(10, numEntries, true);     // total entries
    v.setUint32(12, centralSize, true);    // central dir size
    v.setUint32(16, centralOffset, true);  // central dir offset
    v.setUint16(20, 0, true);             // comment length
    return buf;
  }

  /* ---- 打包成 ZIP Blob ---- */
  function createZip(files) {
    var parts = [], offset = 0, localData = [];
    for (var i = 0; i < files.length; i++) {
      var data = toUtf8(files[i].content);
      var lf = localFile(files[i].path, data);
      parts.push(lf[0]); parts.push(lf[1]);
      localData.push({ path: files[i].path, data: data, offset: offset });
      offset += lf[0].length + lf[1].length;
    }
    var centralStart = offset;
    var centralParts = [];
    for (var j = 0; j < localData.length; j++) {
      var cf = centralFile(localData[j].path, localData[j].data, localData[j].offset);
      centralParts.push(cf);
      offset += cf.length;
    }
    var eocd = endOfCentral(files.length, offset - centralStart, centralStart);
    parts.push.apply(parts, centralParts);
    parts.push(eocd);
    return new Blob(parts, { type: 'application/zip' });
  }

  /* ---- XML 生成器 ---- */
  function contentTypesXml(sheetCount) {
    /* 注意：ECMA-376 规范中属性名是 ContentType（无连字符），
       写成 Content-Type（HTTP 头写法）Excel 会判定文件格式无效。 */
    var lines = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
      '<Default Extension="xml" ContentType="application/xml"/>'];
    for (var i = 1; i <= sheetCount; i++)
      lines.push('<Override PartName="/xl/worksheets/sheet' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    lines.push('<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>');
    lines.push('</Types>');
    return lines.join('\r\n');
  }
  function relsXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  }
  function workbookRelsXml(sheetCount) {
    var lines = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'];
    for (var i = 1; i <= sheetCount; i++)
      lines.push('<Relationship Id="rId' + i + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + i + '.xml"/>');
    lines.push('</Relationships>');
    return lines.join('\r\n');
  }
  function workbookXml(sheets) {
    var lines = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">',
      '<sheets>'];
    for (var i = 0; i < sheets.length; i++)
      lines.push('<sheet name="' + escXml(sheets[i].name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>');
    lines.push('</sheets></workbook>');
    return lines.join('\r\n');
  }
  function sheetXml(sheet) {
    var h = sheet.headers || [];
    var rows = sheet.rows || [];
    var lastCol = h.length > 0 ? colName(h.length - 1) : "A";
    var lines = [
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">',
      '<dimension ref="A1:' + lastCol + (rows.length + 1) + '"/>',
      '<sheetViews><sheetView tabSelected="1" workbookViewId="0"/></sheetViews>',
      '<sheetFormatPr defaultRowHeight="15"/>',
      '<sheetData>'
    ];
    // header row
    if (h.length > 0) {
      var hr = '<row r="1">';
      for (var ci = 0; ci < h.length; ci++)
        hr += '<c r="' + colName(ci) + '1" t="inlineStr"><is><t xml:space="preserve">' + escXml(h[ci]) + '</t></is></c>';
      hr += '</row>';
      lines.push(hr);
    }
    // data rows
    for (var ri = 0; ri < rows.length; ri++) {
      var row = '<row r="' + (ri + 2) + '">';
      var rowData = rows[ri];
      for (var di = 0; di < h.length; di++) {
        var val = (rowData != null && rowData[h[di]] !== undefined) ? rowData[h[di]] : '';
        var cellRef = colName(di) + (ri + 2);
        // 数字且为有限值 -> 数值单元格；其余（含数字形式的编号）一律按文本存，避免丢前导零
        if (typeof val === "number" && isFinite(val)) {
          row += '<c r="' + cellRef + '"><v>' + val + '</v></c>';
        } else {
          // 防御：Excel 单元格文本上限 32767 字符，超长会损坏整个文件
          var txt = String(val);
          if (txt.length > 32767) txt = txt.slice(0, 32767);
          row += '<c r="' + cellRef + '" t="inlineStr"><is><t xml:space="preserve">' + escXml(txt) + '</t></is></c>';
        }
      }
      row += '</row>';
      lines.push(row);
    }
    lines.push('</sheetData></worksheet>');
    return lines.join('\r\n');
  }

  /* ---- Sheet 名兜底清洗：Excel 限制 31 字符且禁用 []:*?/\ ---- */
  function safeSheetName(n, idx, used) {
    var s = String(n == null ? "" : n).replace(/[\\\/\?\*\[\]:]/g, "").trim();
    if (!s) s = "Sheet" + (idx + 1);
    if (s.length > 31) s = s.slice(0, 31);
    if (used[s] !== undefined) {
      var base = s.slice(0, 28), k = 2;
      while (used[base + "_" + k] !== undefined) k++;
      s = base + "_" + k;
    }
    used[s] = 1;
    return s;
  }

  /* ---- 公开 API ---- */
  return function write(sheets, filename) {
    // 先规范化每个 sheet，保证 name/headers/rows 齐全且表名合法
    var used = {}, norm = [];
    for (var i = 0; i < sheets.length; i++) {
      var sh = sheets[i] || {};
      norm.push({
        name: safeSheetName(sh.name, i, used),
        headers: sh.headers || [],
        rows: sh.rows || []
      });
    }
    var files = [
      { path: '[Content_Types].xml', content: contentTypesXml(norm.length) },
      { path: '_rels/.rels', content: relsXml() },
      { path: 'xl/workbook.xml', content: workbookXml(norm) },
      { path: 'xl/_rels/workbook.xml.rels', content: workbookRelsXml(norm.length) }
    ];
    for (var i = 0; i < norm.length; i++)
      files.push({ path: 'xl/worksheets/sheet' + (i + 1) + '.xml', content: sheetXml(norm[i]) });
    var blob = createZip(files);
    downloadBlob(blob, filename);
  };
})();

/* 说明：所有 Excel 导出统一走 NativeXLSX（零依赖，见上方实现）。
   XLSX 库仅保留给「导入 Excel」使用（见下方 importExcel）。 */

/* 导出 JSON 备份：完整无损，结构与 IndexedDB 存储一致，导入可 100% 还原 */
function exportJson() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  downloadBlob(blob, `理货管家备份_${dateStr()}.json`);
  toast("已导出 JSON 备份（完整无损）");
}

/* 从 JSON 备份完整恢复（覆盖当前全部数据） */
async function importJson(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.products) || !Array.isArray(data.packages) || !Array.isArray(data.stores)) {
      toast("备份文件格式不正确，未导入"); return;
    }
    const ok = await openConfirm({ title: "导入 JSON 备份", message: "导入会用备份文件完整替换当前全部数据（供应商 / 包裹 / 产品），且无法撤销。建议先点「导出备份」留一份当前数据。确定覆盖导入？", okText: "覆盖导入", danger: true });
    if (!ok) return;
    state = { stores: data.stores || [], packages: data.packages || [], products: data.products || [] };
    migrateState();
    dedupImages();
    await saveData();
    collapsed.clear();
    renderAll();
    closeReport();
    toast("已从备份恢复全部数据");
  } catch (e) {
    console.error(e);
    toast("导入失败，请检查文件是否为有效的备份");
  }
}

async function importFile(file) {
  const fname = (file.name || "").toLowerCase();
  if (fname.endsWith(".json")) { await importJson(file); return; }
  if (typeof XLSX === "undefined" || !XLSX.utils) { toast("需要联网加载表格库才能导入"); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets["理货明细"] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws);
    rows.forEach(r => {
      const storeName = (r["供应商"] || r["店铺"] || "").toString().trim();
      if (!storeName) return;
      let store = r["id_store"] ? state.stores.find(s => s.id === r["id_store"]) : state.stores.find(s => s.name === storeName);
      if (!store) { store = { id: r["id_store"] || uid(), name: storeName, createdAt: Date.now() }; state.stores.push(store); }
      const pkgName = (r["包裹编号"] || "").toString();
      let pkg = r["id_pkg"] ? state.packages.find(p => p.id === r["id_pkg"]) : state.packages.find(p => p.storeId === store.id && (p.name || "") === pkgName);
      if (!pkg) { pkg = { id: r["id_pkg"] || uid(), storeId: store.id, name: pkgName, logisticsFee: num(r["物流费用"]), createdAt: Date.now() }; state.packages.push(pkg); }
      const prodName = (r["产品名称"] || "").toString().trim();
      if (!prodName) return;
      let prod = r["id_prod"] ? state.products.find(p => p.id === r["id_prod"]) : null;
      const data = {
        name: prodName, purchasePrice: num(r["进货单价"]), retailPrice: num(r["零售价"]),
        quantity: Math.max(1, Math.floor(num(r["数量"])) || 1),
        // 导出时"图片"列已改为有无标记，导入时只接受 base64 图片数据，其余一律忽略
        image: /^data:image\//.test(String(r["图片"] || "")) ? String(r["图片"]) : "", imageName: "",
        model: (r["产品型号"] || "").toString().trim(), category: (r["类别"] || "").toString().trim(),
        material: (r["材质"] || "").toString().trim(), ageRange: (r["适用年龄"] || "").toString().trim(),
        barcode: (r["一维码"] || "").toString().trim(), expiry: (r["到期日"] || "").toString().trim()
      };
      if (prod) Object.assign(prod, data);
      else state.products.push(Object.assign({ id: r["id_prod"] || uid(), packageId: pkg.id }, data));
    });
    await saveData();
    renderAll();
    toast("导入完成");
  } catch (e) {
    console.error(e);
    toast("导入失败，请检查文件格式");
  }
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 应用内确认弹窗（替代原生 confirm） ---------- */
const confirmModal = document.getElementById("confirmModal");
const confirmTitle = document.getElementById("confirmTitle");
const confirmMsg = document.getElementById("confirmMsg");
const confirmOk = document.getElementById("confirmOk");
const confirmCancel = document.getElementById("confirmCancel");
let confirmResolver = null;
function openConfirm(opts) {
  const o = opts || {};
  confirmTitle.textContent = o.title || "确认";
  confirmMsg.textContent = o.message || "";
  confirmOk.textContent = o.okText || "确定";
  confirmCancel.textContent = o.cancelText || "取消";
  confirmOk.className = o.danger ? "btn danger" : "btn primary";
  confirmModal.classList.add("open");
  document.body.style.overflow = "hidden";
  confirmOk.focus();
  return new Promise((resolve) => {
    confirmResolver = (val) => {
      confirmModal.classList.remove("open");
      document.body.style.overflow = "";
      confirmResolver = null;
      resolve(val);
    };
  });
}
function confirmYes() { if (confirmResolver) confirmResolver(true); }
function confirmNo() { if (confirmResolver) confirmResolver(false); }
confirmOk.addEventListener("click", confirmYes);
confirmCancel.addEventListener("click", confirmNo);
confirmModal.addEventListener("click", (e) => { if (e.target === confirmModal) confirmNo(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && confirmModal.classList.contains("open")) confirmNo();
});

/* ---------- 事件委托 ---------- */
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action, id = btn.dataset.id;
  if (action !== "nav-more") closeMorePanel();
  switch (action) {
    case "nav-home": closeReport(); closeClearance(); closeProcure(); setNavActive("home"); break;
    case "nav-more": toggleMorePanel(); break;
    case "add-store": openStoreForm(null); break;
    case "edit-store": openStoreForm(id); break;
    case "add-package": openPackageForm(id, null); break;
    case "edit-package": openPackageForm(null, id); break;
    case "del-package": delPackage(id); break;
    case "add-product": openProductForm(id, null); break;
    case "edit-product": openProductForm(null, id); break;
    case "del-product": delProduct(id); break;
    case "toggle-store":
    case "toggle-package":
      if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
      renderStores();
      break;
    case "export-xlsx": exportXlsx(); break;
    case "export-csv": exportCsv(); break;
    case "import-file": document.getElementById("importInput").click(); break;
    case "export-json": exportJson(); break;
    case "report": openReport(); break;
    case "report-back": closeReport(); break;

        const localEmpty = !(state.stores.length || state.packages.length || state.products.length);

    case "scan-clear": {

/* ---------- 半月报分析 ---------- */
const TRENDY_CATS = ["盲抽盲盒", "潮流"];
const PRICE_ORDER = ["未定价", "≤10元", "10-30元", "30-80元", ">80元"];
const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
function groupBy(rows, keyFn, aggFn) {
  const m = new Map();
  rows.forEach(r => { const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  const out = [];
  m.forEach((g, k) => out.push(Object.assign({ key: k }, aggFn(g))));
  return out;
}
const restockAgg = (g) => ({ products: g.length, p1: sum(g, r => r.p1c), p2: sum(g, r => r.p2c), q: sum(g, r => r.tq), rested: g.filter(r => r.tc > 0).length });
const restockLog = (p) => (p.stockLog || []).filter(e => e && !e.init);
const ymOf = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const dayOf = (ts) => new Date(ts).getDate();
const prevMonth = (ym) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const productCat = (p) => p.category || "未分类";
const priceTier = (rp) => {
  if (!rp || rp <= 0) return "未定价";
  if (rp <= 10) return "≤10元";
  if (rp <= 30) return "10-30元";
  if (rp <= 80) return "30-80元";
  return ">80元";
};
function analyzeMonth(ym) {
  return state.products.map(p => {
    const logs = restockLog(p).filter(e => ymOf(e.at) === ym);
    let p1c = 0, p1q = 0, p2c = 0, p2q = 0;
    logs.forEach(e => { const d = dayOf(e.at); if (d <= 15) { p1c++; p1q += Number(e.qty) || 0; } else { p2c++; p2q += Number(e.qty) || 0; } });
    return { p, p1c, p1q, p2c, p2q, tc: p1c + p2c, tq: p1q + p2q, everRestock: restockLog(p).length > 0 };
  });
}
function reportShell(ym, body) {
  return `<div class="rp-head">
      <div><h2>📊 半月报分析</h2><p class="rp-sub">按「补货（扫码入库）」记录统计 · 数据来自本机 IndexedDB · 仅统计非初始的补货次数</p></div>
      <div class="rp-controls">
        <label class="rp-month">月份 <input type="month" id="reportMonth" value="${ym}" /></label>
        <button class="btn" data-action="report-xlsx">导出 Excel</button>
        <button class="btn" data-action="report-img">导出图片</button>
        <button class="btn" data-action="report-pdf">导出 PDF</button>
        <button class="btn" data-action="report-back">← 返回理货</button>
      </div>
    </div>${body}`;
}
function rpBar(label, val, max, valText) {
  const w = max > 0 ? Math.round(val / max * 100) : 0;
  return `<div class="rp-barrow">
      <div class="rp-barlabel">${esc(label)}</div>
      <div class="rp-bartrack"><div class="rp-barfill" style="width:${w}%"></div></div>
      <div class="rp-barval">${valText}</div>
    </div>`;
}
function rpDelta(cur, prev) {
  const d = Number(cur) - Number(prev);
  if (d > 0) return `<span class="rp-up">▲ +${d}</span>`;
  if (d < 0) return `<span class="rp-down">▼ ${d}</span>`;
  return `<span class="rp-flat">— 持平</span>`;
}
function rpCmpCard(label, cur, prev, prevYm) {
  return `<div class="rp-card">
      <div class="rp-num">${cur}</div>
      <div class="rp-cap">${label}</div>
      <div class="rp-delta">${rpDelta(cur, prev)} <span class="rp-muted">vs ${prevYm}</span></div>
    </div>`;
}
function renderReport(ym) {
  const view = document.getElementById("reportView");
  const rows = analyzeMonth(ym);
  const total = rows.length;
  if (total === 0) {
    view.innerHTML = reportShell(ym, `<div class="rp-empty">还没有任何产品数据。先在「理货管家」里录入或扫码入库产品，半月报才会出数。</div>`);
    return;
  }
  const p1Total = sum(rows, r => r.p1c), p2Total = sum(rows, r => r.p2c);
  const restedProducts = rows.filter(r => r.tc > 0).length;
  const frequent = rows.filter(r => r.tc > 0).sort((a, b) => b.tc - a.tc || b.tq - a.tq);
  const neverRestock = rows.filter(r => !r.everRestock);
  const monthIdle = rows.filter(r => r.tc === 0);
  const maxFreq = frequent.length ? frequent[0].tc : 0;

  const byCat = groupBy(rows, r => productCat(r.p), restockAgg).sort((a, b) => (b.p1 + b.p2) - (a.p1 + a.p2));
  const byPrice = groupBy(rows, r => priceTier(Number(r.p.retailPrice) || 0), restockAgg).sort((a, b) => PRICE_ORDER.indexOf(a.key) - PRICE_ORDER.indexOf(b.key));
  const byTrend = groupBy(rows, r => TRENDY_CATS.includes(r.p.category) ? "潮流类" : "常规类", restockAgg);
  const maxCat = Math.max(1, ...byCat.map(g => g.p1 + g.p2));
  const maxPrice = Math.max(1, ...byPrice.map(g => g.p1 + g.p2));

  const freqHtml = frequent.length ? frequent.map(r => {
    const phase = (r.p1c > 0 && r.p2c > 0) ? "两阶段都进" : (r.p1c > 0 ? "主要在 1-15号" : "主要在 16-31号");
    const w = maxFreq > 0 ? Math.round(r.tc / maxFreq * 100) : 0;
    return `<div class="rp-freq">
        <div class="rp-freq-main"><span class="rp-freq-name">${esc(r.p.name || "未命名产品")}</span><span class="rp-tag">${esc(productCat(r.p))}</span></div>
        <div class="rp-bartrack"><div class="rp-barfill" style="width:${w}%"></div></div>
        <div class="rp-freq-meta">补货 <b>${r.tc}</b> 次 · ${r.tq} 件 · <span class="rp-phase">${phase}</span> <small>(P1 ${r.p1c} / P2 ${r.p2c})</small></div>
      </div>`;
  }).join("") : `<div class="rp-empty">本月暂无补货记录（仅有初始录入，没有扫码补货）。开始用扫码枪入库后，这里会自动统计。</div>`;

  const neverHtml = neverRestock.length ? neverRestock.slice(0, 30).map(r => `<li>${esc(r.p.name || "未命名产品")} <span class="rp-muted">· ${esc(productCat(r.p))}</span></li>`).join("") + (neverRestock.length > 30 ? `<li class="rp-muted">…还有 ${neverRestock.length - 30} 个</li>` : "") : `<div class="rp-empty">没有「建了从不补货」的产品，很好。</div>`;

  const catBars = byCat.map(g => rpBar(`${g.key}（${g.rested}/${g.products} 补货）`, g.p1 + g.p2, maxCat, `P1 ${g.p1} · P2 ${g.p2} · ${g.q}件`)).join("");
  const priceBars = byPrice.map(g => rpBar(`${g.key}（${g.rested}/${g.products} 补货）`, g.p1 + g.p2, maxPrice, `P1 ${g.p1} · P2 ${g.p2} · ${g.q}件`)).join("");
  const trendy = byTrend.find(x => x.key === "潮流类"), normal = byTrend.find(x => x.key === "常规类");
  const trendHtml = `<div class="rp-trend">
      <div class="rp-trend-col"><b>潮流类</b>（盲抽盲盒/潮流）<br>补货 ${trendy ? trendy.p1 + trendy.p2 : 0} 次 · ${trendy ? trendy.q : 0} 件 · ${trendy ? trendy.rested : 0}/${trendy ? trendy.products : 0} 产品</div>
      <div class="rp-trend-col"><b>常规类</b>（食品/玩具/文具/文创等）<br>补货 ${normal ? normal.p1 + normal.p2 : 0} 次 · ${normal ? normal.q : 0} 件 · ${normal ? normal.rested : 0}/${normal ? normal.products : 0} 产品</div>
    </div>`;

  const tips = [];
  if (trendy && normal) {
    if (trendy.q > normal.q) tips.push(`潮流类本月补货 <b>${trendy.q}</b> 件，高于常规类 ${normal.q} 件，动销更好，建议保持高频跟进并拓展同类 SKU。`);
    else if (normal.q > trendy.q) tips.push(`常规类补货 ${normal.q} 件 多于潮流类 ${trendy.q} 件，潮流类可适当加码测试。`);
  }
  const topCat = byCat[0];
  if (topCat && (topCat.p1 + topCat.p2) > 0) tips.push(`「${topCat.key}」是本月补货最活跃的种类（共 ${topCat.p1 + topCat.p2} 次），可作为主力选品方向。`);
  if (neverRestock.length) tips.push(`有 <b>${neverRestock.length}</b> 个产品建了之后从未补过货（只录入没再进），建议复核是否为滞销/一次性，考虑淘汰或促销清仓。`);
  if (monthIdle.length) tips.push(`本月（${ym}）有 ${monthIdle.length} 个产品没有任何补货动作，可结合销量判断是否继续备货。`);
  if (!tips.length) tips.push("本月暂无补货记录，扫码入库后这里会自动统计并给出建议。");

  const prevYm = prevMonth(ym);
  const prevRows = analyzeMonth(prevYm);
  const prevById = new Map(prevRows.map(r => [r.p.id, r]));
  const prevP1 = sum(prevRows, r => r.p1c), prevP2 = sum(prevRows, r => r.p2c);
  const prevRested = prevRows.filter(r => r.tc > 0).length;
  const prevQ = sum(prevRows, r => r.tq);
  const prevTotalRestock = prevP1 + prevP2;
  const prev2Ym = prevMonth(prevYm);
  const prev2Rows = analyzeMonth(prev2Ym);
  const p2P1 = sum(prev2Rows, r => r.p1c), p2P2 = sum(prev2Rows, r => r.p2c);
  const p2Rested = prev2Rows.filter(r => r.tc > 0).length;
  const p2Q = sum(prev2Rows, r => r.tq);
  const curQ = sum(rows, r => r.tq);
  const trendRows = [
    ["1-15号 补货次数", p2P1, prevP1, p1Total],
    ["16-31号 补货次数", p2P2, prevP2, p2Total],
    ["有补货的产品", p2Rested, prevRested, restedProducts],
    ["补货总件数", p2Q, prevQ, curQ]
  ].map(([label, a, b, c]) => `<tr>
      <td>${label}</td><td>${a}</td><td>${b}</td><td class="rp-cur">${c}</td>
      <td>${rpDelta(c, b)}</td><td>${rpDelta(c, a)}</td>
    </tr>`).join("");
  const newRestock = rows.filter(r => r.tc > 0 && (!prevById.has(r.p.id) || prevById.get(r.p.id).tc === 0));
  const stopped = rows.filter(r => r.tc === 0 && prevById.has(r.p.id) && prevById.get(r.p.id).tc > 0);
  const momList = (arr) => arr.length ? arr.slice(0, 30).map(r => `<li>${esc(r.p.name || "未命名产品")} <span class="rp-muted">· ${esc(productCat(r.p))}</span></li>`).join("") + (arr.length > 30 ? `<li class="rp-muted">…还有 ${arr.length - 30} 个</li>` : "") : `<div class="rp-empty">无</div>`;
  const momNote = (prevTotalRestock === 0)
    ? `<p class="rp-note">上月（${prevYm}）没有补货记录，因此本月补货均为新增，「本月停补」为空属正常。</p>`
    : `<p class="rp-note">对比前两个月（${prev2Ym} / ${prevYm}）同口径（仅非初始补货）。比值上涨不代表好坏，需结合销量判断；用于发现进货节奏的变化。</p>`;
  const momHtml = `
    <h3>📈 环比前两月（${prev2Ym} / ${prevYm} / ${ym}）</h3>
    ${momNote}
    <div class="rp-table-wrap"><table class="rp-table">
      <tr><th>指标</th><th>上上月</th><th>上月</th><th>本月</th><th>较上月</th><th>较上上月</th></tr>
      ${trendRows}
    </table></div>
    <div class="rp-two">
      <div><h4>本月新增补货 · ${newRestock.length} 个</h4><ul class="rp-list">${momList(newRestock)}</ul></div>
      <div><h4>本月停补（上月进过、本月没进）· ${stopped.length} 个</h4><ul class="rp-list">${momList(stopped)}</ul></div>
    </div>`;

  const body = `
    <div class="rp-cards">
      <div class="rp-card"><div class="rp-num">${p1Total}</div><div class="rp-cap">1-15号 补货次数</div></div>
      <div class="rp-card"><div class="rp-num">${p2Total}</div><div class="rp-cap">16-31号 补货次数</div></div>
      <div class="rp-card"><div class="rp-num">${restedProducts}<span class="rp-den">/${total}</span></div><div class="rp-cap">本月有补货的产品</div></div>
      <div class="rp-card"><div class="rp-num">${neverRestock.length}</div><div class="rp-cap">从未补货的产品</div></div>
    </div>

    ${momHtml}
    <p class="rp-note">图例：环比 ▲ 红 = 上升 / ▼ 绿 = 下降；毛利「绿 = 盈利 / 红 = 亏损」。</p>

    <h3>🔥 进货频繁 TOP（按本月补货次数排序）</h3>
    <div class="rp-freq-list">${freqHtml}</div>

    <h3>🛑 一直没有进货</h3>
    <p class="rp-note">「从未补货」= 建了产品后再也没用扫码枪进过货；「本月无补货」含前者。</p>
    <div class="rp-two">
      <div><h4>从未补货（建了就再没进过货）· ${neverRestock.length} 个</h4><ul class="rp-list">${neverHtml}</ul></div>
      <div><h4>本月无补货 · ${monthIdle.length} 个</h4><p class="rp-muted">含上面「从未补货」的产品，以及本月恰好没补货的。</p></div>
    </div>

    <h3>🧭 选品角度：种类 / 价格 / 潮流度</h3>
    <h4>按种类（补货次数，P1=1-15号 / P2=16-31号）</h4>
    <div class="rp-bars">${catBars}</div>
    <h4>按价格档（零售价）</h4>
    <div class="rp-bars">${priceBars}</div>
    <h4>按潮流度</h4>
    ${trendHtml}

    <h3>💡 选品建议</h3>
    <ul class="rp-tips">${tips.map(t => `<li>${t}</li>`).join("")}</ul>
  `;
  view.innerHTML = reportShell(ym, body);
}

/* ---------- 临期 / 过期清仓清单 ---------- */
function clearanceItems() {
  const near = Number(alertCfg.nearExpiryDays);
  return state.products.map(p => ({ p, d: daysUntilExpiry(p.expiry) }))
    .filter(x => x.d !== null && (x.d < 0 || (near >= 0 && x.d <= near)))
    .sort((a, b) => a.d - b.d);
}
function renderClearance() {
  const view = document.getElementById("clearanceView");
  const near = Number(alertCfg.nearExpiryDays);
  const items = clearanceItems();
  const emptyHtml = `<div class="rp-head"><div><h2>🧹 临期 / 过期清仓清单</h2><p class="rp-sub">基于各产品「到期日」与预警阈值（临期≤${near}天）自动汇总</p></div>
    <div class="rp-controls"><button class="btn" data-action="clearance-back">← 返回理货</button></div></div>
    <div class="rp-empty">当前没有临期或已过期的产品。给食品等易过期品类填上「到期日」后，这里会自动汇总。</div>`;
  if (items.length === 0) { view.innerHTML = emptyHtml; return; }
  const disc = Number(alertCfg.clearanceDiscount) || 0.7;
  const rows = items.map(x => {
    const p = x.p, d = x.d;
    const cls = d < 0 ? "alert-exp" : "alert-near";
    const tag = d < 0 ? `已过期 ${Math.abs(d)}天` : `临期 ${d}天`;
    const rp = Number(p.retailPrice) || 0;
    const suggest = rp > 0 ? money(rp * disc) : "—";
    return `<div class="clr-item">
      <div class="clr-name">${esc(p.name || "未命名产品")}${p.category ? ` <span class="tag cat">${esc(p.category)}</span>` : ""} <span class="alert-tag ${cls}">${tag}</span></div>
      <div class="clr-meta">数量 ${Number(p.quantity) || 0} 件 · 零售价 ${money(rp)} · <b>建议清仓价 ${suggest}</b>（${foldText(disc)}参考）· 到期日 ${esc(p.expiry || "—")}（剩 ${d}天）</div>
    </div>`;
  }).join("");
  view.innerHTML = `<div class="rp-head"><div><h2>🧹 临期 / 过期清仓清单</h2><p class="rp-sub">共 ${items.length} 个，按紧急度排序 · 建议清仓价 = 零售价 × ${disc}（${foldText(disc)}），可在「预警设置」调整</p></div>

/* ---------- 采购清单（按供应商 / 品类汇总） ---------- */
function procureTarget() { return Math.round((Number(alertCfg.lowStock) || 0) * (Number(alertCfg.procureMultiplier) || 2)); }
function procureItems() {
  const target = procureTarget();
  return state.products.map(p => {
    const q = Number(p.quantity) || 0;
    const suggest = Math.max(0, target - q);
    const cost = Number(p.purchasePrice) || 0;
    const pkg = state.packages.find(x => x.id === p.packageId);
    const store = pkg ? state.stores.find(s => s.id === pkg.storeId) : null;
    return { p, q, suggest, cost, amount: suggest * cost, store: store ? store.name : "未归属" };
  }).filter(x => x.suggest > 0)
    .sort((a, b) => (b.amount - a.amount) || (a.p.name || "").localeCompare(b.p.name || "", "zh"));
}
function renderProcure() {

      <div class="clr-meta">建议补货 <b>${x.suggest}</b> 件 · 进货单价 ${money(x.cost)} · 预计金额 ${money(x.amount)}${x.p.barcode ? ` · 条码 ${esc(x.p.barcode)}` : ""}</div>

      { name: "总览", headers: ["指标", "数值"], rows: overview },
      { name: "按供应商汇总", headers: ["供应商", "需补种数", "建议补货量", "预计金额"], rows: supSummary },

    storeGroups.forEach((rr, sn) => {

/* ---------- 供应商季度复盘 ---------- */
function qKeyOfTs(ts) {
  const d = new Date(ts);
  return d.getFullYear() + "-Q" + (Math.floor(d.getMonth() / 3) + 1);
}
function qRange(qKey) {
  const [y, q] = qKey.split("-Q").map(Number);
  const sm = (q - 1) * 3;
  return { start: new Date(y, sm, 1).getTime(), end: new Date(y, sm + 3, 1).getTime() };
}
function qLabel(qKey) {
  const [y, q] = qKey.split("-Q").map(Number);
  const names = ["1-3月", "4-6月", "7-9月", "10-12月"];
  return y + "年 第" + q + "季度（" + (names[q - 1] || "") + "）";
}
function prevQuarter(qKey) {
  const [y, q] = qKey.split("-Q").map(Number);
  return q > 1 ? y + "-Q" + (q - 1) : (y - 1) + "-Q4";
}
function qvMoneyCard(label, cur, prev, prevLabel) {
  const d = Math.round((Number(cur) - Number(prev)) * 100) / 100;
  const delta = d > 0 ? `<span class="rp-up">▲ +${money(d)}</span>` : d < 0 ? `<span class="rp-down">▼ ${money(d)}</span>` : `<span class="rp-flat">— 持平</span>`;
  return `<div class="rp-card"><div class="rp-num">${money(cur)}</div><div class="rp-cap">${label}</div><div class="rp-delta">${delta} <span class="rp-muted">vs ${prevLabel}</span></div></div>`;
}
function quarterOptions() {
  const set = new Set([qKeyOfTs(Date.now())]);
  state.products.forEach(p => {
    if (p.createdAt) set.add(qKeyOfTs(p.createdAt));
    (p.stockLog || []).forEach(e => { if (e && e.at) set.add(qKeyOfTs(e.at)); });
  });
  return [...set].sort();
}
function quarterCurrent() {
  const sel = document.getElementById("quarterSelect");
  return sel && sel.value ? sel.value : qKeyOfTs(Date.now());
}
function analyzeQuarter(qKey) {
  const { start, end } = qRange(qKey);
  return state.stores.map(store => {
    const pkgs = state.packages.filter(p => p.storeId === store.id);
    const prods = state.products.filter(p => pkgs.some(k => k.id === p.packageId));
    let restockCount = 0, restockQty = 0, restockCost = 0;
    prods.forEach(p => {
      restockLog(p).forEach(e => {
        if (e.at >= start && e.at < end) {
          restockCount++;
          restockQty += Number(e.qty) || 0;
          restockCost += (Number(e.qty) || 0) * (Number(p.purchasePrice) || 0);
        }
      });
    });
    const invCost = prods.reduce((s, p) => s + (Number(p.purchasePrice) || 0) * (Number(p.quantity) || 0), 0);
    const retail = prods.reduce((s, p) => s + (Number(p.retailPrice) || 0) * (Number(p.quantity) || 0), 0);
    const profit = prods.reduce((s, p) => s + productProfit(p) * (Number(p.quantity) || 0), 0);
    const margin = retail > 0 ? profit / retail : 0;
    const newSkus = prods.filter(p => p.createdAt && p.createdAt >= start && p.createdAt < end).length;
    const activeSkus = prods.filter(p => restockLog(p).some(e => e.at >= start && e.at < end)).length;
    return { store, pkgs: pkgs.length, skus: prods.length, restockCount, restockQty, restockCost, invCost, retail, profit, margin, newSkus, activeSkus, idleSkus: prods.length - activeSkus };
  }).filter(r => r.skus > 0 || r.restockCount > 0 || r.pkgs > 0);
}
function qvSuggestion(r) {
  if (r.restockCount === 0) return "本期未补货，若库存已消耗且无需求，可考虑清退或暂停合作";
  if (r.margin < 0) return "预计毛利为负，建议重新谈进货价或做促销清仓";
  if (r.skus > 0 && r.idleSkus / r.skus > 0.5) return "积压 SKU 过半，减少新品尝试并优先清库存";
  return "补货正常，按采购清单维持跟进";
}
function renderQuarter(qKey) {
  const view = document.getElementById("quarterView");
  const rows = analyzeQuarter(qKey);
  const selOpts = quarterOptions().map(k => `<option value="${k}" ${k === qKey ? "selected" : ""}>${qLabel(k)}</option>`).join("");
  const head = `<div class="rp-head"><div><h2>🗓 供应商季度复盘</h2><p class="rp-sub">按「补货记录 + 当前库存」统计 · 毛利为现有库存预计值 · 数据来自本机</p></div>
    <div class="rp-controls">
      <label class="rp-month">季度 <select id="quarterSelect">${selOpts}</select></label>
      <button class="btn" data-action="quarter-xlsx">导出 Excel</button>

  if (rows.length === 0) {
    view.innerHTML = head + `<div class="rp-empty">该季度还没有供应商数据。录入供应商、包裹和产品并扫码入库后，这里会自动生成复盘。</div>`;
    return;
  }
  rows.sort((a, b) => (b.profit - a.profit) || (b.restockCost - a.restockCost));
  const totalRestockCost = rows.reduce((s, r) => s + r.restockCost, 0);
  const totalRestockCount = rows.reduce((s, r) => s + r.restockCount, 0);
  const totalRestockQty = rows.reduce((s, r) => s + r.restockQty, 0);
  const totalActive = rows.reduce((s, r) => s + r.activeSkus, 0);

  const totalProfit = rows.reduce((s, r) => s + r.profit, 0);
  const totalMargin = totalRetail > 0 ? totalProfit / totalRetail : 0;
  const cards = `
    <div class="rp-cards">
      <div class="rp-card"><div class="rp-num">${money(totalRestockCost)}</div><div class="rp-cap">本期补货成本（${qLabel(qKey)}）</div></div>
      <div class="rp-card"><div class="rp-num">${money(totalInvCost)}</div><div class="rp-cap">当前库存货值</div></div>
      <div class="rp-card"><div class="rp-num">${money(totalRetail)}</div><div class="rp-cap">预计零售总额</div></div>
      <div class="rp-card"><div class="rp-num">${money(totalProfit)}</div><div class="rp-cap">预计毛利（${pct(totalMargin)}）</div></div>
    </div>`;
  const prevQKey = prevQuarter(qKey);
  const prevRows = analyzeQuarter(prevQKey);
  const prevById = new Map(prevRows.map(r => [r.store.id, r]));
  const prevRestockCost = prevRows.reduce((s, r) => s + r.restockCost, 0);
  const prevRestockCount = prevRows.reduce((s, r) => s + r.restockCount, 0);
  const prevRestockQty = prevRows.reduce((s, r) => s + r.restockQty, 0);
  const prevActive = prevRows.reduce((s, r) => s + r.activeSkus, 0);
  const prev2QKey = prevQuarter(prevQKey);
  const prev2Rows = analyzeQuarter(prev2QKey);
  const prev2RestockCost = prev2Rows.reduce((s, r) => s + r.restockCost, 0);
  const max3 = Math.max(1, prev2RestockCost, prevRestockCost, totalRestockCost);
  const qChart = `
    <h4>近三季补货成本</h4>

      ${rpBar(qLabel(prev2QKey), prev2RestockCost, max3, money(prev2RestockCost))}
      ${rpBar(qLabel(prevQKey), prevRestockCost, max3, money(prevRestockCost))}
      ${rpBar(qLabel(qKey), totalRestockCost, max3, money(totalRestockCost))}
    </div>`;
  const newSuppliers = rows.filter(r => r.restockCount > 0 && (!prevById.has(r.store.id) || prevById.get(r.store.id).restockCount === 0));
  const stoppedSuppliers = rows.filter(r => r.restockCount === 0 && prevById.has(r.store.id) && prevById.get(r.store.id).restockCount > 0);
  const supList = (arr) => arr.length ? arr.map(r => `<li>${esc(r.store.name)}</li>`).join("") : `<div class="rp-empty">无</div>`;
  const momNote = (prevRestockCount === 0)
    ? `<p class="rp-note">上一季度（${qLabel(prevQKey)}）没有补货记录，因此本季度补货均为新增，「停补」为空属正常。</p>`
    : `<p class="rp-note">对比前两季（${qLabel(prev2QKey)} / ${qLabel(prevQKey)}）同口径：补货成本 / 次数 / 件数 / 动销 SKU。涨跌不代表好坏，需结合销量判断。</p>`;
  const momHtml = `
    <h3>📈 环比前两季（${qLabel(prev2QKey)} / ${qLabel(prevQKey)} / ${qLabel(qKey)}）</h3>
    ${momNote}
    <div class="rp-cards">
      ${qvMoneyCard("补货成本", totalRestockCost, prevRestockCost, qLabel(prevQKey))}
      ${rpCmpCard("补货次数", totalRestockCount, prevRestockCount, qLabel(prevQKey))}
      ${rpCmpCard("补货件数", totalRestockQty, prevRestockQty, qLabel(prevQKey))}
      ${rpCmpCard("动销 SKU", totalActive, prevActive, qLabel(prevQKey))}
    </div>
    ${qChart}
    <div class="rp-two">
      <div><h4>本季新增补货供应商 · ${newSuppliers.length} 个</h4><ul class="rp-list">${supList(newSuppliers)}</ul></div>
      <div><h4>本季停补（上季进、本季没进）· ${stoppedSuppliers.length} 个</h4><ul class="rp-list">${supList(stoppedSuppliers)}</ul></div>
    </div>`;
  const list = rows.map((r, i) => {
    const rankCls = i < 3 ? "top" : "";
    return `<div class="clr-item">
      <div class="clr-name"><span class="qv-rank ${rankCls}">第${i + 1}名</span> ${esc(r.store.name)}${r.skus ? ` <span class="tag cat">${r.skus} SKU</span>` : ""}</div>
      <div class="qv-meta-line">本期补货 <b>${r.restockCount}</b> 次 / ${r.restockQty} 件（约 ${money(r.restockCost)}）· 新进 SKU ${r.newSkus} · 动销 ${r.activeSkus}/${r.skus} · 包裹 ${r.pkgs}</div>
      <div class="qv-meta-line">库存货值 ${money(r.invCost)} · 预计毛利 <b style="color:${r.profit < 0 ? "var(--loss)" : "var(--profit)"}">${money(r.profit)}</b>（${pct(r.margin)}）</div>
      <div class="qv-tip rp-note">💡 ${esc(qvSuggestion(r))}</div>
    </div>`;
  }).join("");
  const tips = [];
  const top = rows[0];
  if (top && top.profit > 0) tips.push(`「${esc(top.store.name)}」是本季度毛利贡献第一（${money(top.profit)}），建议列为<strong>主力供应商</strong>，优先保证货源与上新节奏。`);
  const worst = rows[rows.length - 1];
  if (worst && worst.profit <= 0 && worst.restockCount > 0) tips.push(`「${esc(worst.store.name)}」预计毛利 ${money(worst.profit)} 为负，建议<strong>重新谈进货价或压缩订货量</strong>。`);
  const dead = rows.filter(r => r.restockCount === 0 && r.skus > 0);
  if (dead.length) tips.push(`${dead.length} 个供应商本季度<strong>没有补货</strong>（${dead.map(d => "「" + esc(d.store.name) + "」").join("、")}），若库存已消耗完且无需求，可考虑<strong>清退或暂停合作</strong>。`);
  const idleSum = rows.reduce((s, r) => s + r.idleSkus, 0);
  if (idleSum > 0) tips.push(`全季度有 ${idleSum} 个 SKU 从未补货，多为滞销或一次性采购，建议结合「清仓清单」处理。`);
  if (!tips.length) tips.push("该季度整体平稳，可按半月报与采购清单继续维持。");
  view.innerHTML = head + cards + momHtml + `
    <h3>🏆 供应商排名（按预计毛利）</h3>
    <div class="clr-list">${list}</div>
    <h3>💡 本季度策略建议</h3>
    <ul class="rp-tips">${tips.map(t => `<li>${t}</li>`).join("")}</ul>`;
}

function sanitizeSheet(name) {
  let s = String(name || "供应商").replace(/[\\\[\]:*?\/]/g, "").trim();
  if (!s) s = "供应商";
  return s.slice(0, 31) || "供应商";
}
function quarterExportXlsx() {
  try {
    const qKey = quarterCurrent();
    const rows = analyzeQuarter(qKey).sort((a, b) => (b.profit - a.profit) || (b.restockCost - a.restockCost));
    if (rows.length === 0) { toast("该季度没有供应商数据"); return; }
    const rg = qRange(qKey);
    const totalRestockCost = rows.reduce((s, r) => s + r.restockCost, 0);
    const totalInvCost = rows.reduce((s, r) => s + r.invCost, 0);
    const totalRetail = rows.reduce((s, r) => s + r.retail, 0);
    const totalProfit = rows.reduce((s, r) => s + r.profit, 0);
    var overviewRows = [
      { 指标: "复盘季度", 数值: qLabel(qKey) },
      { 指标: "供应商数", 数值: rows.length },
      { 指标: "本期补货成本", 数值: Math.round(totalRestockCost * 100) / 100 },
      { 指标: "当前库存货值", 数值: Math.round(totalInvCost * 100) / 100 },
      { 指标: "预计零售总额", 数值: Math.round(totalRetail * 100) / 100 },
      { 指标: "预计毛利", 数值: Math.round(totalProfit * 100) / 100 },
      { 指标: "整体毛利率", 数值: pct(totalRetail > 0 ? totalProfit / totalRetail : 0) }
    ];
    var rankRows = rows.map((r, i) => ({ 排名: i + 1, 供应商: r.store.name, "SKU数": r.skus, "补货次数": r.restockCount, "补货件数": r.restockQty, "补货成本": Math.round(r.restockCost * 100) / 100, "库存货值": Math.round(r.invCost * 100) / 100, "预计毛利": Math.round(r.profit * 100) / 100, "毛利率": pct(r.margin), "新进SKU": r.newSkus, "动销SKU": r.activeSkus, "积压SKU": r.idleSkus }));
    var sheets = [
      { name: "总览", headers: ["指标", "数值"], rows: overviewRows },
      { name: "供应商排名", headers: ["排名","供应商","SKU数","补货次数","补货件数","补货成本","库存货值","预计毛利","毛利率","新进SKU","动销SKU","积压SKU"], rows: rankRows }
    ];
    var used = new Set(["总览", "供应商排名"]);
    var detailHeaders = ["产品名称","类别","型号","数量","进货单价","零售价","单件成本含运费","单件毛利","毛利率","小计零售","小计毛利","本季补货次数","本季补货件数"];
    rows.forEach(r => {
      var prods = state.products.filter(p => state.packages.some(k => k.id === p.packageId && k.storeId === r.store.id));
      var detail = prods.map(p => {
        var q = Number(p.quantity) || 0;
        var cost = productCost(p), profit = productProfit(p), margin = productMargin(p);
        var qr = restockLog(p).filter(e => e.at >= rg.start && e.at < rg.end);
        return {
          产品名称: p.name || "未命名产品", 类别: p.category || "", 型号: p.model || "",
          数量: q, 进货单价: Number(p.purchasePrice) || 0, 零售价: Number(p.retailPrice) || 0,
          单件成本含运费: Math.round(cost * 100) / 100, 单件毛利: Math.round(profit * 100) / 100, 毛利率: pct(margin),
          小计零售: Math.round((Number(p.retailPrice) || 0) * q * 100) / 100, 小计毛利: Math.round(profit * q * 100) / 100,
          本季补货次数: qr.length, 本季补货件数: qr.reduce((s, e) => s + (Number(e.qty) || 0), 0)
        };
      });
      let n = sanitizeSheet(r.store.name), k = 2;
      while (used.has(n)) { n = r.store.name + " " + k; k++; }
      used.add(n);
      sheets.push({ name: n, headers: detailHeaders, rows: detail });
    });
    NativeXLSX(sheets, `季度复盘_${qKey}.xlsx`);
    toast("已导出 Excel（每个供应商一个 sheet）");
  } catch (e) {
    console.error("quarterExportXlsx 失败", e);
    toast("Excel 导出失败：" + ((e && e.message) || e));
  }
}

/* ---------- 半月报导出（图片 / PDF） ---------- */
function reportMonthValue() {
  const inp = document.getElementById("reportMonth");
  return inp ? inp.value : "";
}
async function captureElement(el) {
  if (!el) return null;
  const controls = el.querySelector(".rp-controls");
  const prev = controls ? controls.style.display : "";
  if (controls) controls.style.display = "none";
  try {
    return await html2canvas(el, { backgroundColor: "#f4f6f9", scale: 2, useCORS: true, logging: false });
  } finally {
    if (controls) controls.style.display = prev;
  }
}
function exportUnavailable(kind) {
  const offline = typeof navigator !== "undefined" && navigator.onLine === false;
  const why = offline ? "当前处于离线状态（未联网）" : "绘图组件未加载（可能被网络拦截，或首次打开时未联网加载）";
  return `「${kind}」导出需要联网加载绘图组件（html2canvas / jsPDF），${why}，暂不可用。` + (offline ? "建议联网后重试。" : "");
}
function exportOfflineFallback(kind) {
  let action = null;
  if (!document.getElementById("reportView").hidden) action = reportExportXlsx;
  else if (!document.getElementById("quarterView").hidden) action = quarterExportXlsx;
  else if (!document.getElementById("procureView").hidden) action = procExportXlsx;
  else if (!document.getElementById("clearanceView").hidden) action = clearanceCopy;
  const msg = exportUnavailable(kind);
  if (action) {
    openConfirm({ title: "无法导出" + kind, message: msg + "\n\n是否改用「Excel / CSV 导出」？CSV 无需联网，内容同样完整。", okText: "改用导出", cancelText: "取消" }).then(ok => { if (ok) action(); });
  } else {
    openConfirm({ title: "无法导出" + kind, message: msg, okText: "知道了" });
  }
}
async function exportImage(el, name) {
  if (typeof html2canvas === "undefined") { exportOfflineFallback("图片"); return; }
  toast("正在生成图片…");
  try {
    const canvas = await captureElement(el);
    if (!canvas) return;
    canvas.toBlob((blob) => { if (blob) downloadBlob(blob, name + ".png"); }, "image/png");
    toast("已导出图片");
  } catch (e) { console.error(e); toast("图片导出失败"); }
}
async function exportPdf(el, name) {
  if (typeof html2canvas === "undefined" || !window.jspdf || !window.jspdf.jsPDF) { exportOfflineFallback("PDF"); return; }
  toast("正在生成 PDF…");
  try {
    const canvas = await captureElement(el);
    if (!canvas) return;
    const img = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const imgW = pw;
    const imgH = canvas.height * imgW / canvas.width;
    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(img, "PNG", 0, position, imgW, imgH);
    heightLeft -= ph;
    while (heightLeft > 0) {
      position -= ph;
      pdf.addPage();
      pdf.addImage(img, "PNG", 0, position, imgW, imgH);
      heightLeft -= ph;
    }
    pdf.save(name + ".pdf");
    toast("已导出 PDF");
  } catch (e) { console.error(e); toast("PDF 导出失败"); }
}

/* 半月报导出 Excel（总览 + TOP + 选品维度 + 每供应商一个 sheet，纯原生生成） */
function reportExportXlsx() {
  try {
    const ym = reportMonthValue();
    if (!ym) { toast("请先选择月份"); return; }
    const rows = analyzeMonth(ym);
    if (rows.length === 0) { toast("该月份没有产品数据"); return; }
    const p1Total = sum(rows, r => r.p1c), p2Total = sum(rows, r => r.p2c);
    const restedProducts = rows.filter(r => r.tc > 0).length;
    const neverRestock = rows.filter(r => !r.everRestock);
    const totalQty = sum(rows, r => r.tq);
    const trendyRows = rows.filter(r => TRENDY_CATS.includes(r.p.category));
    const normalRows = rows.filter(r => !TRENDY_CATS.includes(r.p.category));
    const top = rows.filter(r => r.tc > 0).sort((a, b) => b.tc - a.tc || b.tq - a.tq).map((r, i) => {
      const phase = (r.p1c > 0 && r.p2c > 0) ? "两阶段都进" : (r.p1c > 0 ? "主要在1-15号" : "主要在16-31号");
      return { 排名: i + 1, 产品: r.p.name || "未命名产品", 类别: r.p.category || "", "P1次数": r.p1c, "P2次数": r.p2c, 本月次数: r.tc, 补货件数: r.tq, 补货阶段: phase };
    });
    const storeMap = new Map();
    rows.forEach(r => {
      const pkg = state.packages.find(x => x.id === r.p.packageId);
      const store = pkg ? state.stores.find(s => s.id === pkg.storeId) : null;
      const sn = store ? store.name : "未归属";
      if (!storeMap.has(sn)) storeMap.set(sn, []);
      storeMap.get(sn).push(r);
    });
    const catAgg = groupBy(rows, r => productCat(r.p), restockAgg).sort((a, b) => (b.p1 + b.p2) - (a.p1 + a.p2));
    const priceAgg = groupBy(rows, r => priceTier(Number(r.p.retailPrice) || 0), restockAgg).sort((a, b) => PRICE_ORDER.indexOf(a.key) - PRICE_ORDER.indexOf(b.key));
    const trendyAgg = groupBy(rows, r => TRENDY_CATS.includes(r.p.category) ? "潮流类" : "常规类", restockAgg);
    var overview = [
      { 指标: "复盘月份", 数值: ym },
      { 指标: "1-15号补货次数", 数值: p1Total },
      { 指标: "16-31号补货次数", 数值: p2Total },
      { 指标: "有补货的产品", 数值: restedProducts },
      { 指标: "从未补货的产品", 数值: neverRestock.length },
      { 指标: "本月无补货的产品", 数值: rows.filter(r => r.tc === 0).length },
      { 指标: "补货总件数", 数值: totalQty },
      { 指标: "潮流类补货(次/件)", 数值: sum(trendyRows, r => r.tc) + " 次 / " + sum(trendyRows, r => r.tq) + " 件" },
      { 指标: "常规类补货(次/件)", 数值: sum(normalRows, r => r.tc) + " 次 / " + sum(normalRows, r => r.tq) + " 件" }
    ];
    var sheets = [
      { name: "总览", headers: ["指标", "数值"], rows: overview },
      { name: "进货频繁TOP", headers: ["排名","产品","类别","P1次数","P2次数","本月次数","补货件数","补货阶段"], rows: top },
      { name: "种类汇总", headers: ["种类","产品数","P1次数","P2次数","补货件数","补货产品数"], rows: catAgg.map(g => ({ 种类: g.key, 产品数: g.products, "P1次数": g.p1, "P2次数": g.p2, 补货件数: g.q, 补货产品数: g.rested })) },
      { name: "价格档汇总", headers: ["价格档","产品数","P1次数","P2次数","补货件数","补货产品数"], rows: priceAgg.map(g => ({ 价格档: g.key, 产品数: g.products, "P1次数": g.p1, "P2次数": g.p2, 补货件数: g.q, 补货产品数: g.rested })) },
      { name: "潮流度", headers: ["潮流度","产品数","补货次数","补货件数","补货产品数"], rows: trendyAgg.map(g => ({ 潮流度: g.key, 产品数: g.products, 补货次数: g.p1 + g.p2, 补货件数: g.q, 补货产品数: g.rested })) }
    ];
    var used = new Set(["总览", "进货频繁TOP", "种类汇总", "价格档汇总", "潮流度"]);
    var detailHeaders = ["产品名称","类别","数量","进货单价","零售价","单件毛利","小计零售","本月补货次数","本月补货件数","到期日"];
    storeMap.forEach((rrs, sn) => {
      var detail = rrs.map(r => {
        var p = r.p, q = Number(p.quantity) || 0;
        return {
          产品名称: p.name || "未命名产品", 类别: p.category || "", 数量: q,
          进货单价: Number(p.purchasePrice) || 0, 零售价: Number(p.retailPrice) || 0,
          单件毛利: Math.round(productProfit(p) * 100) / 100,
          小计零售: Math.round((Number(p.retailPrice) || 0) * q * 100) / 100,
          本月补货次数: r.tc, 本月补货件数: r.tq, 到期日: p.expiry || ""
        };
      });
      let n = sanitizeSheet(sn), k = 2;
      while (used.has(n)) { n = sn + " " + k; k++; }
      used.add(n);
      sheets.push({ name: n, headers: detailHeaders, rows: detail });
    });
    NativeXLSX(sheets, `半月报_${ym}.xlsx`);
    toast("已导出 Excel（总览 + TOP + 每供应商一个 sheet）");
  } catch (e) {
    console.error("reportExportXlsx 失败", e);
    toast("Excel 导出失败：" + ((e && e.message) || e));
  }
}

/* ---------- 数据迁移：旧产品补齐 createdAt / stockLog ---------- */
function migrateState() {
  if (!state || !Array.isArray(state.products)) return;
  const now = Date.now();
  state.products.forEach(p => {
    if (!p.createdAt) p.createdAt = now;
    if (!Array.isArray(p.stockLog)) {
      p.stockLog = [{ at: now, qty: Number(p.quantity) || 0, init: true }];
    }
  });
}
/* 同一条码去重图片：以该码首个带图产品的图片为准，其余同码产品复用同一张，减少重复存储 */
function dedupImages() {
  if (!state || !Array.isArray(state.products)) return false;
  const byBarcode = new Map();
  state.products.forEach(p => { if (p.barcode && p.image && !byBarcode.has(p.barcode)) byBarcode.set(p.barcode, p.image); });
  let changed = false;
  state.products.forEach(p => {
    if (p.barcode && byBarcode.has(p.barcode) && p.image !== byBarcode.get(p.barcode)) {
      p.image = byBarcode.get(p.barcode);
      changed = true;
    }
  });
  return changed;
}

/* ---------- 启动 ---------- */
async function boot() {
  state = await loadLocal();
  if (ghCfg.owner && ghCfg.token) {
    if (ghInit()) {
      const remote = await loadRemote();
      const localEmpty = !(state.stores.length || state.packages.length || state.products.length);
      if (remote && remote.data && Array.isArray(remote.data.products) && localEmpty) { state = remote.data; await saveLocal(); }
    }
  }
  migrateState();
  if (dedupImages()) saveLocal();
  renderAll();
  setNavActive("home");
  updateSyncUI();
}
boot();
